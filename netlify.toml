# Netlify 部署配置
# 主程序 = 仓库根目录的 index.html。纯静态、无框架、无依赖，不需要 npm install。

[build]
  # 只把 index.html 发布出去：5 个 .docx、研究报告、build/ 都不上公网。
  # 如果这一步将来出问题，把下面两行换成 publish = "." 并删掉 command 即可（代价是仓库文件都会公开）。
  command = "mkdir -p dist && cp index.html dist/index.html"
  publish = "dist"

# ---------------------------------------------------------------- 响应头
# 重点：connect-src 'none' —— 从浏览器层面禁止页面发起任何网络连接。
# 也就是说「不上传您填写的信息」不只是承诺，浏览器会直接拦掉。
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    # 每次都校验：改了立刻生效；没改走 304，不用重复下载 806 KB
    Cache-Control = "public, max-age=0, must-revalidate"
