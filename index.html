<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230f7b5f'/%3E%3Cpath%20d='M28%2014h8v14h14v8H36v14h-8V36H14v-8h14z'%20fill='%23fff'/%3E%3C/svg%3E">
<title>体检项目参考工具（依据国家卫健委 2025 版指引）</title>
<meta name="theme-color" content="#0f7b5f">
<style>
/* ============================================================
   大留白极简 · Design Tokens
   结构靠留白与发丝线；强调靠浅灰面或深色实心；全站单一重音色
   ============================================================ */
:root{
  --fs:17px;
  --bg:#f2f6f4; --card:#ffffff; --ink:#0d1a16; --muted:#5f6f69;
  --line:#eef1f0; --line-2:#e2e7e5;
  --brand:#12352b; --brand-d:#0a231c; --brand-2:#1d5a48;
  --brand-l:#f2f7f5; --brand-l2:#e6efeb;
  --amber:#8a5a12; --amber-l:#fdf8ee; --amber-b:#efe0c4;
  --danger:#9c2b22; --danger-l:#fdf1f0; --danger-b:#f0cfcb;
  --gray:#4a5a54; --gray-l:#f5f7f6; --gray-l2:#eaefee;
  --wash:#e8f3ee; --wash-2:#f0f8f4; --warm-l:#fdfbf3;
  --ink-2:#3f4d49; --brand-ink:#1d4b3f; --amber-ink:#6b4a12; --danger-ink:#7d2b23;
  --term:#3d2f05; --term-l:#fdf1bd; --term-l2:#fbe79a; --term-b:#e0b93c;
  --radius:16px; --radius-sm:12px; --radius-xs:9px;
  --shadow:none; --shadow-sm:none;
  --shadow-lg:0 30px 70px -30px rgba(9,25,20,.38);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font:var(--fs)/1.78 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(180deg,var(--wash) 0,rgba(232,243,238,0) 340px),var(--bg);
  color:var(--ink);-webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
::selection{background:var(--brand-l2);color:var(--brand)}
:focus-visible{outline:2.5px solid var(--brand-2);outline-offset:2px}
button{font-family:inherit;-webkit-user-select:none;user-select:none}
.wrap{max-width:760px;margin:0 auto;padding:0 22px 142px}

header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);box-shadow:none}
.hd{max-width:760px;margin:0 auto;padding:15px 22px 9px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{flex:0 0 auto;width:26px;height:26px;display:block;border-radius:8px}
.hd h1{font-size:var(--fs);margin:0;font-weight:700;line-height:1.3;flex:1;min-width:0;letter-spacing:-.3px;color:var(--ink)}
.hd .tag{font-size:12px;color:var(--muted);font-weight:400;display:block;margin-top:3px;letter-spacing:.3px}
.hd h1 .ttlbtn{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:none;border:0;padding:0;
  color:inherit;font:inherit;font-weight:700;cursor:pointer;text-align:left;font-family:inherit}
.hd h1 .ttlbtn .ttl{line-height:1.3}
.hd h1 .ttlbtn:hover .ttl,.hd h1 .ttlbtn:focus-visible .ttl{text-decoration:underline;text-underline-offset:3px}
.hd h1 .homechip{font-size:calc(var(--fs) - 5px);font-weight:700;white-space:nowrap;line-height:1.75;
  background:transparent;border:0;border-radius:0;padding:0;color:var(--muted);transition:color .16s var(--ease)}
.hd h1 .ttlbtn:hover .homechip,.hd h1 .ttlbtn:focus-visible .homechip{background:transparent;color:var(--brand)}
.hd h1 .ttlbtn:focus-visible{outline:2.5px solid var(--brand-2);outline-offset:4px;border-radius:6px}
.fsbtn{display:flex;gap:14px;flex:0 0 auto;background:transparent;border:0;padding:0}
.fsbtn button{background:transparent;color:var(--muted);border:0;border-radius:0;
  min-width:34px;height:38px;padding:0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;
  transition:color .16s var(--ease)}
.fsbtn button:hover{color:var(--ink)}
.fsbtn button.on{background:transparent;color:var(--brand);box-shadow:none}
.tabs{max-width:760px;margin:0 auto;padding:0 22px}
.seg{display:flex;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0;gap:0}
.seg button{flex:1;font-family:inherit;font-size:calc(var(--fs) - 2px);font-weight:700;cursor:pointer;
  background:transparent;color:var(--muted);border:0;border-radius:0;
  border-bottom:2.5px solid transparent;margin-bottom:-1px;
  padding:12px 10px;min-height:48px;line-height:1.3;
  transition:color .16s var(--ease),border-color .16s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:transparent;color:var(--ink);border-bottom-color:var(--brand);box-shadow:none}
.seg .cnt{display:inline-block;background:transparent;border-radius:0;padding:0;
  font-size:calc(var(--fs) - 5px);margin-left:6px;font-weight:700;color:var(--muted)}
.seg button.on .cnt{background:transparent;color:var(--brand)}
.bar{height:2.5px;background:var(--line)}
.bar i{display:block;height:100%;width:0;border-radius:0;
  background:var(--brand);transition:width .34s var(--ease)}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:none;
  padding:24px 26px;margin:20px 0}
.card > h2{font-size:calc(var(--fs) + 9px);margin:0 0 8px;line-height:1.24;letter-spacing:-1.1px;font-weight:800}
.card > .sub{color:var(--muted);font-size:calc(var(--fs) - 1px);margin:0 0 18px;line-height:1.7}

.ask{background:var(--amber-l);border:0;border-radius:var(--radius-sm);padding:16px 18px;margin:0 0 20px}
.ask b{color:var(--amber);display:block;font-size:calc(var(--fs) - 4px);font-weight:800;
  letter-spacing:.5px;margin-bottom:9px}
.ask p{margin:0;font-size:calc(var(--fs) - 2px);color:var(--amber-ink);line-height:1.76}
.infobox{background:var(--brand-l);border:0;border-radius:var(--radius-sm);
  padding:16px 18px;margin:14px 0;font-size:calc(var(--fs) - 2px);line-height:1.82;color:var(--brand-ink)}
.infobox b{color:var(--brand)}
.note{background:var(--brand-l);border:0;border-radius:var(--radius-sm);
  padding:16px 18px;margin:16px 0;font-size:calc(var(--fs) - 2px);line-height:1.78}
.note.warn{background:var(--danger-l)}
.note b{color:var(--brand)}
.note.warn b{color:var(--danger)}
.ai{background:var(--danger-l);border:0;border-radius:var(--radius-sm);padding:16px 18px;margin:22px 0;
  text-align:left;font-size:calc(var(--fs) - 3px);line-height:1.76;color:var(--danger-ink)}
.ai b{display:block;color:var(--danger);margin-bottom:6px;font-size:calc(var(--fs) - 2px);
  font-weight:800;letter-spacing:-.1px}
.ai.slim{padding:14px 16px;font-size:calc(var(--fs) - 4px);line-height:1.7;margin:14px 0}
.ai.slim b{display:inline;margin:0}
.docnote{background:var(--danger-l);border:0;border-radius:var(--radius-sm);
  padding:16px 18px;margin:0 0 18px;font-size:calc(var(--fs) - 3px);line-height:1.78;color:var(--danger-ink)}

.q{padding:26px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:6px}
.q > .lab{font-weight:700;display:block;margin-bottom:8px;font-size:calc(var(--fs) + 1px);
  line-height:1.5;letter-spacing:-.3px}
.hint{color:var(--muted);font-size:calc(var(--fs) - 4px);line-height:1.72}
.q > .hint{font-size:calc(var(--fs) - 3px);margin:0 0 14px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{position:relative;cursor:pointer;flex:0 0 auto;max-width:100%}
.opt input{position:absolute;opacity:0;width:0;height:0}
.opt > span{padding:14px 17px;border:0;border-radius:13px;background:var(--gray-l);
  font-size:var(--fs);line-height:1.5;min-height:52px;display:block;font-weight:600;color:var(--ink-2);
  transition:background .15s var(--ease),color .15s var(--ease)}
.opt > span:hover{background:var(--gray-l2);color:var(--ink)}
.opt input:checked + span{background:var(--brand);color:#fff;font-weight:700;box-shadow:none}
.opt input:checked + span .term{color:#fff;background:rgba(255,255,255,.2);
  border-bottom-color:rgba(255,255,255,.8)}
.opt input:checked + span .term:hover{background:rgba(255,255,255,.3)}
.opt input:focus-visible + span{outline:2.5px solid var(--brand-2);outline-offset:2px}
.opt.block{flex:1 1 100%}
.onum{display:inline-block;vertical-align:middle;min-width:20px;text-align:left;margin-right:9px;
  background:transparent;color:var(--muted);font-style:normal;font-weight:700;
  font-size:calc(var(--fs) - 4px);flex:0 0 auto}
.opt > span .onum{flex:0 0 auto}
.opt input:checked + span .onum{background:transparent;color:rgba(255,255,255,.62)}
.num{display:flex;align-items:center;gap:10px;max-width:320px}
.num input[type=number],.num input[type=text]{flex:1;font:inherit;font-size:calc(var(--fs) + 2px);font-weight:700;
  font-variant-numeric:tabular-nums;padding:13px 15px;border:0;border-radius:13px;background:var(--gray-l);
  min-height:52px;width:100%;transition:background .15s var(--ease),box-shadow .15s var(--ease)}
.num input:focus{outline:none;background:#fff;box-shadow:0 0 0 2.5px var(--brand)}
.num .u{color:var(--muted);font-size:calc(var(--fs) - 2px);flex:0 0 auto}
.sec{margin:32px 0 10px;font-weight:800;font-size:calc(var(--fs) + 1px);color:var(--brand);
  border-bottom:1px solid var(--line);padding-bottom:9px;letter-spacing:-.3px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--line);box-shadow:none;
  padding:10px 22px calc(12px + env(safe-area-inset-bottom))}
.nv{max-width:760px;margin:0 auto;display:flex;gap:14px;align-items:center}
.nv button{font:inherit;font-weight:700;border-radius:13px;padding:15px 18px;cursor:pointer;
  border:0;min-height:54px;transition:background .16s var(--ease),color .16s var(--ease),transform .1s var(--ease)}
.nv button:active{transform:translateY(1px)}
.nv .back{background:transparent;color:var(--muted);flex:0 0 auto;padding:15px 6px}
.nv .back:hover{color:var(--ink)}
.nv .next{background:var(--brand);color:#fff;flex:1;box-shadow:none}
.nv .next:hover{background:var(--brand-d)}
.nv .step{font-size:calc(var(--fs) - 4px);color:var(--muted);flex:0 0 auto;padding:0 4px;font-weight:600;
  font-variant-numeric:tabular-nums}

.big{display:flex;flex-wrap:wrap;gap:20px;margin:0 0 10px}
.metric{flex:1 1 128px;background:transparent;border:0;border-top:1px solid var(--line);
  border-radius:0;padding:15px 0 0}
.metric .v{font-size:calc(var(--fs) + 11px);font-weight:800;line-height:1.1;letter-spacing:-1.3px;
  font-variant-numeric:tabular-nums}
.metric .k{font-size:calc(var(--fs) - 5px);color:var(--muted);margin-top:5px;line-height:1.5}
.metric.warn .v{color:var(--amber)}
.metric.bad .v{color:var(--danger)}
.metric.ok .v{color:var(--brand)}
.rk{background:transparent;border:0;border-radius:0;border-top:1px solid var(--line);
  padding:18px 0;margin:0}
.rk b{display:block;margin-bottom:6px;font-size:calc(var(--fs) + 1px);line-height:1.5;font-weight:800;
  letter-spacing:-.3px}
.rk.hi b{color:var(--danger)}
.rk .why{font-size:calc(var(--fs) - 2px);color:var(--muted);line-height:1.74}
.tier{margin:30px 0}
.tier > h3{font-size:calc(var(--fs) + 2px);margin:0 0 13px;display:flex;align-items:center;gap:10px;
  line-height:1.4;letter-spacing:-.5px;font-weight:800}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.tier.b .dot{background:var(--muted)}
.tier.p .dot{background:var(--brand)}
.tier.o .dot{background:var(--amber)}
.grp{background:var(--gray-l);border:0;border-radius:var(--radius-sm);padding:18px;margin:11px 0;
  transition:background .16s var(--ease)}
.grp:hover{background:var(--gray-l2)}
.grp h4{margin:0 0 8px;font-size:var(--fs);line-height:1.5;font-weight:800;letter-spacing:-.2px}
.grp ul{margin:0;padding-left:19px}
.grp li{margin:7px 0;font-size:calc(var(--fs) - 2px);line-height:1.74}
.tagline{display:inline-block;font-size:calc(var(--fs) - 5px);padding:2px 9px;border-radius:8px;
  background:var(--brand-l2);color:var(--brand);font-weight:700;white-space:nowrap;
  margin-left:8px;vertical-align:1px;letter-spacing:.2px}
.tagline.e{background:#fbe3e0;color:var(--danger)}
.tagline.n{background:#e9edeb;color:var(--gray)}
.disc{font-size:calc(var(--fs) - 4px);color:var(--muted);line-height:1.84;border-top:1px solid var(--line);
  margin-top:26px;padding-top:18px}

.hero{text-align:left;padding:34px 26px 12px;margin-top:20px;
  background:linear-gradient(180deg,var(--wash-2) 0,rgba(240,248,244,0) 68%),var(--card)}
.hero .ic{font-size:34px;line-height:1;display:block;width:auto;height:auto;border-radius:0;
  background:transparent;box-shadow:none}
.hero h2{font-size:calc(var(--fs) + 13px);margin:18px 0 13px;letter-spacing:-1.4px;line-height:1.22;
  font-weight:800;text-align:left}
.hero p.lead{color:var(--muted);margin:0;max-width:30em;font-size:var(--fs);line-height:1.82;text-align:left}
.pick{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.pick label{flex:1 1 220px;cursor:pointer;position:relative;display:flex;min-width:0}
.pick input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.pick .box{display:block;width:100%;border:0;border-radius:var(--radius);padding:26px 16px;text-align:center;
  background:var(--gray-l);transition:background .16s var(--ease),color .16s var(--ease)}
.pick label:hover .box{background:var(--gray-l2);transform:none}
.pick .box .e{font-size:28px;display:block;margin-bottom:11px}
.pick .box b{display:block;font-size:calc(var(--fs) + 1px);margin-bottom:6px;font-weight:800}
.pick .box small{color:var(--muted);font-size:calc(var(--fs) - 4px);line-height:1.62;display:block}
.pick input:checked + .box{background:var(--brand);transform:none;box-shadow:none}
.pick input:checked + .box b{color:#fff}
.pick input:checked + .box small{color:rgba(255,255,255,.72)}
.pick input:focus-visible + .box{outline:2.5px solid var(--brand-2);outline-offset:3px}

.src{font-size:calc(var(--fs) - 4px);color:var(--muted);line-height:1.62;margin:-2px 0 8px}
.grp .src{margin:-4px 0 8px}
.rk .src{margin:8px 0 0}
.legend{background:var(--warm-l);border:0;border-radius:var(--radius-sm);
  padding:14px 16px;margin:22px 0 4px;font-size:calc(var(--fs) - 4px);line-height:1.76;
  color:var(--muted);text-align:left}
.legend b{color:var(--ink)}
.legend .term{cursor:pointer}
.srcbox{margin-top:28px;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);
  border-radius:0;padding:20px 0 0}
.srcbox h3{margin:0 0 6px;font-size:calc(var(--fs) + 1px);color:var(--ink);line-height:1.5;font-weight:800;
  letter-spacing:-.3px}
.srcbox > ol{margin:0;padding:0;list-style:none;counter-reset:d}
.srcbox > ol > li{counter-increment:d;position:relative;padding:11px 0 11px 30px;
  font-size:calc(var(--fs) - 3px);line-height:1.66;color:var(--gray);border-top:1px solid var(--line)}
.srcbox > ol > li:first-child{border-top:0}
.srcbox > ol > li::before{content:counter(d);position:absolute;left:0;top:11px;width:20px;
  text-align:left;background:transparent;border-radius:0;font-size:calc(var(--fs) - 4px);font-weight:700;
  color:var(--muted);line-height:1.66}
.srcbox p{margin:14px 0 0;padding-top:14px;border-top:1px solid var(--line);
  color:var(--muted);font-size:calc(var(--fs) - 4px);line-height:1.72}
.citenote{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line);
  color:var(--muted);font-size:calc(var(--fs) - 4px);line-height:1.84}
.citenote ol{margin:6px 0 0;padding-left:20px}
.citenote li{margin:9px 0}
.citenote b{color:var(--ink)}

.doclist details{border:0;border-top:1px solid var(--line);border-radius:0;margin:0;
  background:transparent;scroll-margin-top:150px}
.doclist details[open]{box-shadow:none;border-color:var(--line)}
.doclist summary{cursor:pointer;padding:19px 38px 19px 0;font-weight:700;background:transparent;
  line-height:1.55;font-size:calc(var(--fs) - 1px);list-style:none;position:relative;
  transition:color .15s var(--ease)}
.doclist summary::-webkit-details-marker{display:none}
.doclist summary::after{content:"";position:absolute;right:6px;top:25px;width:9px;height:9px;
  border-right:1.8px solid var(--muted);border-bottom:1.8px solid var(--muted);
  transform:rotate(45deg);transition:transform .2s var(--ease),border-color .2s var(--ease)}
.doclist details[open] summary::after{transform:rotate(-135deg);border-color:var(--brand)}
.doclist summary:hover{background:transparent;color:var(--brand)}
.doclist details[open] summary{background:transparent;color:var(--ink);border-bottom:0}
.doclist summary .meta{display:block;font-weight:400;color:var(--muted);font-size:calc(var(--fs) - 5px);
  margin-top:7px;line-height:1.62}
.rdtxt{padding:6px 2px 18px;font-size:calc(var(--fs) - 3px);line-height:1.88;color:var(--ink)}
.rdtxt.pre{white-space:pre-wrap;word-break:break-word;line-height:1.92}
.rdtxt h4{margin:24px 0 9px;font-size:calc(var(--fs) - 1px);color:var(--ink);line-height:1.5;font-weight:800;
  letter-spacing:-.2px}
.rdtxt h4:first-child{margin-top:6px}
.rdtxt p{margin:9px 0}
.rdtxt table{width:100%;border-collapse:collapse;margin:0;font-size:calc(var(--fs) - 5px)}
.rdtxt th,.rdtxt td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top;line-height:1.62}
.rdtxt th{background:var(--brand-l);color:var(--ink);font-weight:700}
.rdtxt img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:12px;margin:16px 0;display:block}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;margin:16px 0;
  border:1px solid var(--line);border-radius:12px}
.tw table{margin:0;border:0}
.tw::-webkit-scrollbar{height:7px}
.tw::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
.rddl{padding:16px 0 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rdbtn{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;border:0;border-radius:13px;
  padding:14px 20px;font-weight:700;font-size:calc(var(--fs) - 3px);min-height:50px;line-height:22px;
  box-shadow:none;transition:background .16s var(--ease),transform .1s var(--ease)}
.rdbtn:link,.rdbtn:visited{color:#fff}
.rdbtn.sec{background:var(--gray-l);color:var(--brand)}
.rdbtn.sec:link,.rdbtn.sec:visited{color:var(--brand)}
.rdbtn:hover{background:var(--brand-d)}
.rdbtn.sec:hover{background:var(--gray-l2)}
.rdbtn:active{transform:translateY(1px)}
.rdnote{flex:1 1 240px;min-width:200px;color:var(--muted);font-size:calc(var(--fs) - 4px);line-height:1.76}
.rdnote b{color:var(--danger)}
.rdzip{display:inline-block;margin-top:12px;background:var(--danger);color:#fff;border:0;border-radius:13px;
  padding:14px 20px;font:inherit;font-weight:700;font-size:calc(var(--fs) - 3px);cursor:pointer;min-height:50px;
  box-shadow:none;transition:filter .16s var(--ease),transform .1s var(--ease)}
.rdzip:hover{filter:brightness(1.1)}
.rdzip:active{transform:translateY(1px)}
.rdzip:disabled{opacity:.55;cursor:default;filter:none}
.extraref{margin:18px 0 0;padding:18px 0 0;border:0;border-top:1px solid var(--line);border-radius:0;
  background:transparent;color:var(--muted);font-size:calc(var(--fs) - 4px);line-height:1.82}
.extraref b{color:var(--ink);font-size:calc(var(--fs) - 2px)}
.extraref ul{margin:9px 0 0;padding-left:20px}
.extraref li{margin:7px 0}

/* =========================== 状态 =========================== */
var A = {};            // 答案
var cur = 0;           // 当前步
var FS = [17,20,23];   // 字号档位

function num(x){ var n=parseFloat(x); return isNaN(n)?null:n; }
function has(arr,k){ return Object.prototype.toString.call(arr)==='[object Array]' && arr.indexOf(k)>=0; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function isFamily(){ return A.who==="family"; }
function isHighArea(){ var v=A.highrisk_area; return !!v && v!=="n" && v!=="u"; }

function calcBmi(){ var h=num(A.height), w=num(A.weight); if(!h||!w) return null; return w/((h/100)*(h/100)); }
function packYears(){ var p=num(A.smoke_ppd), y=num(A.smoke_years); if(!p||!y) return null; return (p/20)*y; }

/* =========================== 评分表 =========================== */
function dmScore(){
  var age=num(A.age), sbp=num(A.sbp), bmi=calcBmi(), w=num(A.waist), s=0, ok=false;
  if(age!==null){ s += age<25?0:age<35?4:age<40?8:age<45?11:age<50?12:age<55?13:age<60?15:age<65?16:18; ok=true; }
  if(sbp!==null){ s += sbp<110?0:sbp<120?1:sbp<130?3:sbp<140?6:sbp<150?7:sbp<160?8:10; ok=true; }
  if(bmi!==null){ s += bmi<22?0:bmi<24?1:bmi<30?3:5; ok=true; }
  if(w!==null){ var m=A.sex==="m";
    s += m?(w<75?0:w<80?3:w<85?5:w<90?7:w<95?8:10):(w<70?0:w<75?3:w<80?5:w<85?7:w<90?8:10); ok=true; }
  s += has(A.fam_other,"dm")?6:0;
  s += A.sex==="m"?2:0;
  return ok?s:null;
}
function copdScore(){
  var age=num(A.age), py=packYears(), bmi=calcBmi(), s=0, ok=false;
  if(age!==null&&age>=40){ s += age<50?0:age<60?4:age<70?8:11; ok=true; }
  if(age!==null&&age<40) return null;
  if(py!==null){ s += py<1?0:py<15?2:py<30?4:5; ok=true; }
  else if(A.smoke==="never"||A.smoke==="passive"){ s += 0; ok=true; }
  if(bmi!==null){ s += bmi<18.5?7:bmi<24?4:bmi<28?1:0; ok=true; }
  s += A.cough==="y"?5:0;
  s += A.breath==="s"?6:A.breath==="m"?3:0;
  s += A.biofuel==="y"?1:0;
  s += has(A.fam_other,"copd_fam")?3:0;
  return ok?s:null;
}
function crcScore(){
  var age=num(A.age), bmi=calcBmi(), s=0, ok=false;
  if(age!==null){ s += age<50?0:age<60?1:2; ok=true; }
  s += A.sex==="m"?1:0;
  s += (A.smoke==="current"||A.smoke==="quit")?1:0;
  if(bmi!==null){ s += bmi<23?0:1; ok=true; }
  if(has(A.fam_cancer,"结直肠癌")) s += 4;
  return ok?s:null;
}
function bpLevel(){
  var s=num(A.sbp), d=num(A.dbp); if(s===null||d===null) return null;
  if(s>=180||d>=110) return {t:"3 级高血压",c:"bad"};
  if(s>=160||d>=100) return {t:"2 级高血压",c:"bad"};
  if(s>=140||d>=90)  return {t:"1 级高血压",c:"warn"};
  if(s>=120||d>=80)  return {t:"血压偏高",c:"warn"};
  if(s<90||d<60)     return {t:"血压偏低",c:"warn"};
  return {t:"血压正常",c:"ok"};
}

/* =========================== 判定引擎 =========================== */
function assess(){
  var a=A, age=num(a.age)||0, bmi=calcBmi(), risks=[], metrics={}, warn=[];
  var dms=dmScore(), copds=copdScore(), crcs=crcScore();
  var py=packYears();
  var central = num(a.waist)!==null && (a.sex==="m" ? num(a.waist)>=90 : num(a.waist)>=85);

  function add(k, reason, lvl){ risks.push({k:k, why:reason, lvl:lvl||"high"}); }

  /* --- 心血管 --- */
  var cv=[];
  if(num(a.ldl)!==null && num(a.ldl)>=4.9) cv.push("LDL-C ≥4.9 mmol/L");
  if(num(a.tc)!==null && num(a.tc)>=7.2) cv.push("总胆固醇 ≥7.2 mmol/L");
  if(age>=40 && has(a.dx,"糖尿病")) cv.push("40 岁以上糖尿病");
  if(has(a.dx,"ckd")) cv.push("慢性肾脏病");
  if(cv.length) add("cvd", cv.join("；"));
  else if(has(a.dx,"hbp")||has(a.dx,"lipid")||has(a.dx,"chd")||has(a.dx,"stroke")||a.smoke==="current")
    warn.push("您有心血管危险因素，建议请医生用官方 China-PAR 工具评估 10 年风险。");

  /* --- 糖尿病 --- */
  var dm=[];
  if(has(a.dx,"predm")) dm.push("糖尿病前期");
  if(age>=35) dm.push("年龄 ≥35 岁");
  if(bmi!==null&&bmi>=24) dm.push("BMI ≥24");
  if(central) dm.push("中心型肥胖（腰围超标）");
  if(has(a.fam_other,"dm")) dm.push("一级亲属有糖尿病");
  if(a.exercise==="none") dm.push("缺乏体力活动");
  if(has(a.dx,"hbp")) dm.push("有高血压或正在降压治疗");
  if(num(a.hdl)!==null&&num(a.hdl)<0.9) dm.push("HDL-C <0.90");
  if(num(a.tg)!==null&&num(a.tg)>2.22) dm.push("甘油三酯 >2.22");
  if(has(a.dx,"stroke")||has(a.dx,"chd")) dm.push("有动脉粥样硬化性心血管疾病史");
  if(has(a.dx,"fattyliver")) dm.push("脂肪肝");
  if(has(a.dx,"pancreatitis")) dm.push("胰腺炎病史");
  if(has(a.meds,"steroid")) dm.push("有类固醇类药物使用史");
  if(has(a.meds,"psych")) dm.push("长期用抗精神病/抗抑郁药");
  if(dms!==null&&dms>=25) dm.push("中国糖尿病风险评分 "+dms+" 分（≥25 为高风险）");
  var dmStrong = has(a.dx,"predm")||has(a.fam_other,"dm")||(dms!==null&&dms>=25)||has(a.dx,"chd")||has(a.dx,"stroke")||has(a.dx,"fattyliver")||has(a.dx,"pancreatitis")||has(a.meds,"steroid")||has(a.meds,"psych")||(num(a.hdl)!==null&&num(a.hdl)<0.9)||(num(a.tg)!==null&&num(a.tg)>2.22);
  if(dm.length) add("dm", dm.slice(0,4).join("；")+(dm.length>4?" 等":""), dmStrong?"high":"watch");
  if(has(a.dx,"糖尿病")) add("dm_dx","已确诊糖尿病，需做并发症筛查");

  /* --- COPD --- */
  if(copds!==null&&copds>=16) add("copd","COPD 筛查问卷 "+copds+" 分（≥16 为高风险）");
  else if(age>=40&&(a.cough==="y"||a.breath==="m"||a.breath==="s")) warn.push("有咳嗽或气促症状，建议加做肺功能检查。");

  /* --- 肺癌 --- */
  var lr=[];
  if(py!==null&&py>=20) lr.push("吸烟 "+(Math.round(py*10)/10)+" 包年");
  if(a.smoke==="quit"&&num(a.quit_years)!==null&&num(a.quit_years)<15&&py!==null&&py>=20) lr.push("戒烟不足 15 年");
  if(num(a.passive_years)!==null&&num(a.passive_years)>=20) lr.push("被动吸烟 ≥20 年");
  if(has(a.dx,"copd")) lr.push("患有慢阻肺");
  if(a.occup==="y") lr.push("有职业暴露史");
  if(has(a.fam_cancer,"肺癌")) lr.push("一级亲属有肺癌");
  if(age>=50&&lr.length) add("lung", lr.join("；"));

  /* --- 结直肠癌 --- */
  if(crcs!==null&&crcs>=4) add("crc","结直肠癌风险评分 "+crcs+" 分（≥4 为高风险）");
  if(a.lynch==="y") add("crc","林奇综合征/家族性腺瘤性息肉病");

  /* --- 胃癌 --- */
  var gr=[];
  if(has(a.fam_cancer,"胃癌")) gr.push("一级亲属有胃癌");
  if(a.hp==="pos") gr.push("幽门螺杆菌阳性");
  if(has(a.dx,"atrophic")) gr.push("慢性萎缩性胃炎/胃溃疡");
  if(has(a.diet,"salty")||has(a.diet,"pickled")) gr.push("高盐/腌制饮食习惯");
  if((a.smoke==="current")||a.alcohol==="l4") gr.push("吸烟或重度饮酒");
  if(isHighArea()) gr.push("胃癌/食管癌高发地区");
  var gStrong = has(a.fam_cancer,"胃癌")||a.hp==="pos"||has(a.dx,"atrophic");
  if(age>=45&&gr.length) add("gastric", gr.join("；"), gStrong?"high":"watch");

  /* --- 肝癌 --- */
  var lv=[];
  if(has(a.dx,"hbv")) lv.push("乙肝病毒感染");
  if(has(a.dx,"hcv")) lv.push("丙肝病毒感染");
  if(has(a.dx,"cirrhosis")) lv.push("肝硬化");
  if(has(a.dx,"fattyliver")) lv.push("脂肪肝");
  if(a.alcohol==="l4"||a.binge==="d") lv.push("过度饮酒");
  if(has(a.fam_cancer,"肝癌")) lv.push("肝癌家族史");
  if(lv.length) add("liver", lv.join("；"));

  /* --- 乳腺癌 --- */
  if(a.sex==="f"){
    var br=[];
    if(has(a.fam_cancer,"乳腺癌")||has(a.fam_cancer,"卵巢癌")) br.push("一级亲属有乳腺癌或卵巢癌");
    if(a.fam_breast_2nd==="y") br.push("二级亲属 50 岁前患乳腺癌/卵巢癌");
    if(a.brca==="y") br.push("BRCA1/2 突变");
    if(a.menarche==="early") br.push("月经初潮 ≤12 岁");
    if(a.menopause==="late") br.push("绝经 ≥55 岁");
    if(a.biopsy==="y") br.push("有乳腺活检或不典型增生病史");
    if(has(a.meds,"hrt_both")) br.push("雌孕激素联合激素替代治疗");
    var two=[];
    if(a.birth==="no") two.push("无活产史"); else if(a.breastfeed==="none") two.push("无哺乳或哺乳<4 个月");
    if(has(a.meds,"hrt_e")) two.push("仅用雌激素替代治疗");
    if(a.abortion==="m") two.push("流产 ≥2 次");
    if(two.length>=2) br.push(two.join("、")+"（任意两项）");
    if(br.length) add("breast", br.join("；"));
  }

  /* --- 前列腺癌 --- */
  if(a.sex==="m"){
    var pr=[];
    if(age>=60) pr.push("年龄 ≥60 岁");
    if(age>=45&&has(a.fam_cancer,"前列腺癌")) pr.push("≥45 岁且有前列腺癌家族史");
    if(a.brca==="y"&&age>=40) pr.push("BRCA2 突变且 ≥40 岁");
    if(pr.length) add("prostate", pr.join("；"));
  }

  /* --- 卵巢癌 --- */
  if(a.sex==="f"){
    if(has(a.fam_cancer,"卵巢癌")||has(a.fam_cancer,"乳腺癌")) add("ovary","有乳腺癌或卵巢癌家族史");
    else if(a.brca==="y") add("ovary","BRCA1/2 胚系突变携带者");
    else if(a.lynch==="y") add("ovary","林奇综合征家族史");
  }

  /* --- 食管癌 --- */
  var es=[];
  if(has(a.fam_cancer,"食管癌")) es.push("一级亲属有食管癌");
  if(isHighArea()) es.push("胃癌/食管癌高发地区");
  if(has(a.diet,"hot")||has(a.diet,"pickled")||has(a.diet,"salty")) es.push("热烫/高盐/腌制饮食");
  if(has(a.dx,"barrett")) es.push("巴雷特食管或反流性食管炎");
  if(a.smoke==="current"||a.alcohol==="l4") es.push("吸烟或重度饮酒");
  var eStrong = has(a.fam_cancer,"食管癌")||has(a.dx,"barrett")||a.highrisk_area==="y";
  if(age>=45&&es.length) add("esophageal", es.join("；"), eStrong?"high":"watch");

  /* --- 甲状腺癌 --- */
  var th=[];
  if(a.radiation==="y") th.push("童年头颈部放射史或全身放疗史");
  if(has(a.fam_cancer,"甲状腺癌")) th.push("甲状腺癌家族史");
  if(th.length) add("thyroid", th.join("；"));

  /* --- 认知 --- */
  if(a.sex==="m"||a.sex==="f"){
    if(a.mem==="y"||a.mem_worry==="y") add("cognition","存在记忆下降主诉，或家人观察到认知变化");
    else if(age>=50) add("cognition","年龄 ≥50 岁（推荐开展脑认知健康筛查）","watch");
  }

  /* --- 骨质疏松 --- */
  var os=[];
  if(a.sex==="f"&&age>=65) os.push("女性 ≥65 岁");
  if(num(a.bmd)!==null&&num(a.bmd)<=-2.5) os.push("骨密度 T 值 ≤-2.5");
  if(has(a.dx,"osteop")) os.push("已诊断骨质疏松");
  if(a.f_loss==="y") os.push("近 1 年体重明显下降");
  if(os.length) add("osteoporosis", os.join("；"));

  /* --- 慢性肾病 --- */
  if(has(a.dx,"ckd")) add("ckd","已诊断慢性肾脏病");
  else if(has(a.dx,"糖尿病")||has(a.dx,"hbp")) add("ckd","糖尿病/高血压是慢性肾病主要危险因素，建议加做尿微量白蛋白","watch");

  /* --- 肥胖代谢 --- */
  if(bmi!==null&&(bmi>=28||(bmi>=24&&central))) add("obesity","BMI "+(Math.round(bmi*10)/10)+(central?"，且腰围超标":""), bmi>=28?"high":"watch");

  /* --- 腹主动脉瘤 --- */
  if(a.sex==="m"&&age>=65&&age<=75&&(a.smoke==="current"||a.smoke==="quit")) add("aaa","65–75 岁曾吸烟男性");

  /* ================= 老年评估发现 ================= */
  var elder=[];
  var frail=[a.f_fatigue,a.f_stair,a.f_walk,a.f_ill,a.f_loss].filter(function(x){return x==="y";}).length;
  if(frail>=1) elder.push({t:frail>=3?"衰弱（FRAIL "+frail+" 分）":frail>=1?"衰弱前期（FRAIL "+frail+" 分）":"", lvl:frail>=3?"bad":"warn"});
  var calf=num(a.calf);
  if(calf!==null&&((a.sex==="m"&&calf<34)||(a.sex==="f"&&calf<33))||a.grip==="low")
    elder.push({t:"肌少症风险（小腿围或握力提示）", lvl:"warn"});
  var fallN=[a.fall_hx,a.fall_unsteady,a.fall_worry].filter(function(x){return x==="y";}).length;
  if(fallN>0||a.fall_speed==="slow")
    elder.push({t:"跌倒风险"+(fallN>=2||a.fall_speed==="slow"?"偏高":"（需关注）")+"，建议做 4 米步速与 TUG 评估", lvl:fallN>=2?"bad":"warn"});
  if(a.appetite==="y"||a.f_loss==="y") elder.push({t:"营养不良风险，建议做 MNA-SF 营养评估", lvl:"warn"});
  if(num(a.med_count)!==null&&num(a.med_count)>=5) elder.push({t:"多重用药（"+a.med_count+" 种），建议按 Beers 标准做用药核查与处方精简", lvl:"bad"});
  if(a.mem==="y"&&a.mem_worry==="y") elder.push({t:"认知功能下降风险，建议做 MMSE/MoCA 评估", lvl:"bad"});
  else if(a.mem==="y"||a.mem_worry==="y") elder.push({t:"记忆下降主诉，建议关注并随访", lvl:"warn"});
  if(a.mood1==="y") elder.push({t:"抑郁情绪初筛阳性，建议做 GDS-15", lvl:"warn"});
  if(a.mood2==="y") elder.push({t:"焦虑情绪初筛阳性，建议做 GAD-7", lvl:"warn"});
  if(a.incont==="y") elder.push({t:"尿失禁，建议评估（ICIQ-SF），多数可改善", lvl:"warn"});
  if(a.constip==="y") elder.push({t:"便秘，建议调整饮食与用药", lvl:"warn"});
  if(a.pain==="h") elder.push({t:"持续疼痛（≥4 分），建议疼痛评估与干预", lvl:"warn"});
  if(a.swallow==="y") elder.push({t:"饮水呛咳，建议做吞咽功能评估（洼田饮水试验）", lvl:"bad"});
  if(a.hearing==="bad"||a.hearing==="m") elder.push({t:"听力下降 —— 影响超半数 70 岁以上老人，与抑郁和认知下降相关，建议做听力评估", lvl:"warn"});
  if(a.vision==="bad"||a.vision==="m") elder.push({t:"视力下降，建议眼科检查（白内障、青光眼、眼底）", lvl:"warn"});
  if(a.adl==="mild"||a.adl==="bad"||a.iadl==="mild"||a.iadl==="bad")
    elder.push({t:"日常生活能力下降，建议做 ADL/IADL 正式评估并考虑照护支持", lvl:"bad"});
  if(a.alone==="alone") elder.push({t:"独居 —— 建议加强随访、安装紧急呼叫、排查居家环境风险", lvl:"warn"});

  return {risks:risks, elder:elder, metrics:{bmi:bmi, bp:bpLevel(), dmScore:dms, copdScore:copds, crcScore:crcs, frailty:frail, packYears:py}, warn:warn, central:central};
}

/* =========================== 结果渲染 =========================== */
function tierHtml(cls, title, groups){
  if(!groups.length) return "";
  var s='<div class="tier '+cls+'"><h3><span class="dot"></span>'+title+'</h3>';
  for(var i=0;i<groups.length;i++){
    var g=groups[i];
    s+='<div class="grp"><h4>'+esc(g.g)+'</h4>';
    if(g.src) s+='<div class="src">依据：'+esc(g.src)+'</div>';
    s+='<ul>';
    for(var j=0;j<g.list.length;j++) s+='<li>'+g.list[j]+'</li>';
    s+='</ul></div>';
  }
  return s+'</div>';
}

  /* 免责 */
  s+='<div class="card"><h2>📚 本工具依据以下 '+SOURCES.length+' 份文件设计</h2><div class="srcbox" style="margin-top:0;border:0;background:none;padding:0"><ol>';
  for(var si=0;si<SOURCES.length;si++) s+='<li>'+esc(SOURCES[si])+'</li>';

 "骨质疏松":{"d":"骨量减少、骨微结构破坏，导致骨头变脆、容易骨折。女性绝经后风险明显升高。",q:"骨质疏松　优先推荐：双能X线骨密度、定量CT",ref:"附件3·三、其他慢性病风险人群筛查项目（骨质疏松）",doc:4},
 "甲状腺结节":{"d":"甲状腺内出现的团块，绝大多数是良性的。一般不推荐对普通人群做超声普筛，以免发现大量无需处理的结节。",ref:"本工具补充：依据现行国内外指南，不推荐无症状普通人群做甲状腺癌超声筛查",doc:9},
 "抑郁":{"d":"一种常见的情绪障碍，表现为持续情绪低落、兴趣减退、精力下降等。体检自测问卷中提供抑郁自评量表作为选做项目。",ref:"《成人健康体检项目推荐指引（2025年版）》附件1·抑郁自评量表（选做项目）",doc:2},
 "焦虑":{"d":"以过度担心、紧张不安为主要表现的情绪问题。附件1 中提供广泛性焦虑自评量表作为选做项目。",ref:"附件1·广泛性焦虑自评量表（选做项目）",doc:2},
 "高危型HPV":{"d":"高危型人乳头瘤病毒持续感染是宫颈癌的主要病因。附件2 将高危型 HPV 核酸检测列为基本体检项目。",q:"分子检查　高危型HPV核酸检测",ref:"附件2·实验室检查—分子检查",doc:3},
 "宫颈癌":{"d":"发生在子宫颈的恶性肿瘤，与高危型 HPV 持续感染密切相关，可通过 HPV 检测和细胞学检查早期发现。",q:"细胞学检查　子宫颈细胞学检查",ref:"附件2·实验室检查—细胞学检查",doc:3},
 "肺癌":{"d":"发生在肺部的恶性肿瘤。筛查只推荐低剂量 CT，且限高风险人群。",q:"肺癌　优先推荐：胸部低剂量CT",ref:"附件3·二、常见恶性肿瘤风险人群筛查项目（肺癌）",doc:4},
 "胃癌":{"d":"发生在胃的恶性肿瘤。首选筛查手段是胃镜。",q:"胃癌　优先推荐：胃镜",ref:"附件3·二、常见恶性肿瘤风险人群筛查项目（胃癌）",doc:4},
 "食管癌":{"d":"发生在食管的恶性肿瘤，在中国有明显的地区聚集性。首选筛查手段是内镜。",q:"食管癌　优先推荐：普通白光内镜",ref:"附件3·二、常见恶性肿瘤风险人群筛查项目（食管癌）",doc:4},
 "结直肠癌":{"d":"发生在结肠或直肠的恶性肿瘤，多数由腺瘤性息肉逐步发展而来，所以早期做肠镜可以同时切除息肉。",q:"结肠癌　优先推荐：结肠镜",ref:"附件3·二、常见恶性肿瘤风险人群筛查项目（结肠癌）",doc:4},
 "肝癌":{"d":"发生在肝脏的恶性肿瘤，乙肝、丙肝、肝硬化、过度饮酒是主要危险因素。筛查用甲胎蛋白加肝脏超声。",q:"肝癌　优先推荐：甲胎蛋白、甲胎蛋白异质体、异常凝血酶原",ref:"附件3·二、常见恶性肿瘤风险人群筛查项目（肝癌）",doc:4},
 "乳腺癌":{"d":"发生在乳腺的恶性肿瘤。筛查手段以乳腺 X 线（钼靶）为主，中国人群常联合超声。",q:"乳腺癌　优先推荐：乳腺X线检查",ref:"附件3·二、常见恶性肿瘤风险人群筛查项目（乳腺癌）",doc:4},
 "前列腺癌":{"d":"发生在男性前列腺的恶性肿瘤。筛查用 PSA，但必须与医生共同决策，高龄男性一般不建议常规筛查。",q:"前列腺癌　优先推荐：前列腺超声、总前列腺特异性抗原、游离前列腺特异性抗原……",ref:"附件3·二、常见恶性肿瘤风险人群筛查项目（前列腺癌）",doc:4},
 "甲状腺癌":{"d":"发生在甲状腺的恶性肿瘤。多数进展缓慢，国际上不推荐对无症状普通人群做超声普筛。",q:"甲状腺癌　优先推荐：甲状腺及颈部淋巴结超声",ref:"附件3·二、常见恶性肿瘤风险人群筛查项目（甲状腺癌）",doc:4},
 "卵巢癌":{"d":"发生在卵巢的恶性肿瘤。起病隐匿，目前尚无被证实能降低死亡率的普通人群筛查方案，仅对遗传高危者做专科评估。",q:"卵巢癌　优先推荐：阴道超声、糖类抗原125、人附睾蛋白4",ref:"附件3·二、常见恶性肿瘤风险人群筛查项目（卵巢癌）",doc:4},
 "胰腺癌":{"d":"发生在胰腺的恶性肿瘤，早期症状不明显。附件3 列出了筛查项目，但附件5 未定义风险人群，本工具已标注该缺口。",q:"胰腺癌　优先推荐：糖类抗原19-9、胰腺增强CT",ref:"附件3·二、常见恶性肿瘤风险人群筛查项目（胰腺癌）",doc:4},
 "癌前病变":{"d":"本身不是癌，但长期存在有较大概率发展为癌的病变，例如萎缩性胃炎、巴雷特食管、腺瘤性息肉。发现后需要定期随访。",ref:"附件5·六、十一、五 各风险人群条目中的癌前疾病",doc:6},
 "血常规":{"d":"抽血检查红细胞、白细胞、血小板等，用于筛查贫血、感染、血液系统疾病。",ref:"《成人健康体检项目推荐指引（2025年版）》附件2·实验室检查—常规检查",doc:3},
 "尿常规":{"d":"检查尿液中的蛋白、糖、红细胞、白细胞等，是肾脏和泌尿系统的基础筛查。",ref:"附件2·实验室检查—常规检查",doc:3},
 "粪便常规":{"d":"检查粪便中的隐血等，其中隐血试验是结直肠癌的基础筛查手段之一。",q:"粪便常规+隐血试验",ref:"附件2·实验室检查—常规检查",doc:3},
 "肝功能":{"d":"通过转氨酶、胆红素、白蛋白等指标反映肝细胞损伤和肝脏合成功能。",ref:"附件2·实验室检查—生化检查",doc:3},
 "肾功能":{"d":"通过尿素氮、肌酐反映肾脏排泄功能。建议同时计算 eGFR。",ref:"附件2·实验室检查—生化检查",doc:3},
 "eGFR":{"d":"估算肾小球滤过率，由血肌酐、年龄、性别计算得出，比单看肌酐更能反映肾功能水平。",ref:"本工具补充：附件2 列出肌酐，本工具建议同时计算 eGFR",doc:3},
 "血脂四项":{"d":"包括总胆固醇、甘油三酯、低密度脂蛋白胆固醇（LDL-C）、高密度脂蛋白胆固醇（HDL-C）。",ref:"附件2·实验室检查—生化检查",doc:3},
 "低密度脂蛋白":{"d":"即 LDL-C，俗称“坏胆固醇”，是动脉粥样硬化最主要的危险因素。附件5 以 LDL-C ≥4.9 mmol/L 直接判为心血管病高风险。",q:"低密度脂蛋白胆固醇≥4.9mmol/L或总胆固醇≥7.2mmol/L",ref:"附件5·一、心血管病风险人群（一）1.",doc:6},
 "高密度脂蛋白":{"d":"即 HDL-C，俗称“好胆固醇”。附件5 以 HDL-C <0.90 mmol/L 作为糖尿病的风险条件之一。",q:"高密度脂蛋白胆固醇<0.90mmol/L和（或）甘油三酯>2.22mmol/L",ref:"附件5·二、糖尿病风险人群（十）",doc:6},
 "甘油三酯":{"d":"血脂的一种。升高与饮食、饮酒、肥胖、糖尿病有关。",ref:"附件5·二、糖尿病风险人群（十）",doc:6},
 "总胆固醇":{"d":"血脂中的一项。附件5 以总胆固醇 ≥7.2 mmol/L 直接判为心血管病高风险。",ref:"附件5·一、心血管病风险人群（一）1.",doc:6},
 "空腹血糖":{"d":"空腹至少 8 小时后测的血糖。是糖尿病筛查的基础项目。",ref:"附件2·实验室检查—生化检查（血糖）",doc:3},
 "血尿酸":{"d":"嘌呤代谢的产物。升高可能诱发痛风，也与肾脏损害相关。",ref:"附件2·实验室检查—生化检查（血尿酸）",doc:3},
 "同型半胱氨酸":{"d":"一种氨基酸代谢产物，升高被认为是心脑血管病的危险因素。附件2 将其列为基本项目。",ref:"附件2·实验室检查—生化检查（血同型半胱氨酸）",doc:3},
 "促甲状腺激素":{"d":"即 TSH，反映甲状腺功能的最敏感指标。附件2 将 TSH 与游离甲状腺素列为基本项目。",ref:"附件2·实验室检查—甲状腺功能检查",doc:3},
 "子宫颈细胞学检查":{"d":"俗称 TCT，采集宫颈细胞做病理检查，用于发现宫颈癌及癌前病变。",q:"细胞学检查　子宫颈细胞学检查",ref:"附件2·实验室检查—细胞学检查",doc:3},
 "十二导联心电图":{"d":"常规心电图检查，用于发现心律失常、心肌缺血等。",ref:"附件2·辅助检查—心电图检查",doc:3},
 "胸部正位片":{"d":"胸部 X 线检查。指南明确：不推荐用于肺癌筛查，只作心肺常规检查。",q:"胸部正位片或正侧位片：肺部、心脏、胸廓、纵隔",ref:"附件2·辅助检查—放射检查",doc:3},
 "腹部超声":{"d":"用超声检查肝、胆、胰、脾、肾的形态，是基础项目之一。",ref:"附件2·辅助检查—超声检查",doc:3},
 "人体成分分析":{"d":"测量体脂率、肌肉与脂肪分布，比单纯称体重更能反映身体构成。",ref:"附件2·辅助检查—人体成分分析",doc:3},
 "肺功能检查":{"d":"通过用力呼气等动作评估气道通畅程度，是慢阻肺诊断和筛查的关键检查。指南规定 40 岁以上人群加做。",q:"肺功能检查　40岁以上人群",ref:"附件2·辅助检查—肺功能检查",doc:3},
 "骨密度检测":{"d":"测量骨矿物质含量，用于判断骨质疏松。建议先做骨折风险评估，再决定是否检查。",q:"骨密度检测　40岁以上人群",ref:"附件2·辅助检查—骨密度检测",doc:3},
 "颈动脉超声":{"d":"用超声观察颈动脉是否有斑块和狭窄。斑块是全身动脉粥样硬化的窗口，也是脑卒中的风险来源。",q:"高血压　优先推荐：动态血压、超声心动图、颈动脉超声",ref:"附件3·一（高血压优先推荐）",doc:4},
 "超声心动图":{"d":"即心脏彩超，观察心脏结构、瓣膜和泵血功能。",ref:"附件3·一（高血压优先推荐）",doc:4},
 "动态血压":{"d":"佩戴 24 小时血压记录仪，比诊室单次测量更能反映真实血压水平，可发现白大衣高血压和夜间高血压。",ref:"附件3·一（高血压优先推荐）",doc:4},
 "动态心电图":{"d":"佩戴 24 小时心电记录仪，用于发现阵发性心律失常和心肌缺血。",ref:"附件3·一（冠心病优先推荐）",doc:4},
 "眼底照相":{"d":"拍摄视网膜照片，可直接观察高血压、糖尿病引起的微血管病变。",ref:"附件3·一（高血压可选项目）、附件3·三（2型糖尿病可选项目）",doc:4},
 "胱抑素C":{"d":"一种比肌酐更敏感的肾功能指标，用于早期发现肾功能下降。",q:"慢性肾病　优先推荐：尿微量白蛋白/肌酐比值、血清胱抑素C",ref:"附件3·三（慢性肾病优先推荐）",doc:4},
 "口服葡萄糖耐量试验":{"d":"即 OGTT，空腹抽血后喝糖水再定时抽血，是诊断糖尿病和糖尿病前期的标准方法。",q:"2型糖尿病　优先推荐：口服葡萄糖耐量试验",ref:"附件3·三（2型糖尿病优先推荐）",doc:4},
 "乳腺X线检查":{"d":"即钼靶，是乳腺癌筛查的首选影像学方法。中国女性乳腺较致密，常与超声联合使用。",q:"乳腺癌　优先推荐：乳腺X线检查",ref:"附件3·二（乳腺癌优先推荐）",doc:4},
 "阴道超声":{"d":"经阴道做的超声检查，图像比腹部超声更清晰，用于观察子宫、附件和卵巢。",q:"卵巢癌　优先推荐：阴道超声、糖类抗原125、人附睾蛋白4",ref:"附件3·二（卵巢癌优先推荐）",doc:4},
 "前列腺超声":{"d":"用超声观察前列腺大小和形态，常与 PSA 联合评估。",ref:"附件3·二（前列腺癌优先推荐）",doc:4},
 "热层析成像":{"d":"一种乳腺红外成像技术。美国 FDA 明确表示没有科学证据支持其作为独立的乳腺癌筛查手段，本工具已剔除。",ref:"本工具补充：依据 FDA 2023 年声明与美国 USPSTF，不推荐用于乳腺癌筛查",doc:4},
 "癌胚抗原":{"d":"即 CEA，一种肿瘤标志物。不推荐用于无症状人群的癌症筛查，主要用途是已确诊患者的随访监测。",q:"肝癌　可选项目：癌胚抗原、糖类抗原19-9……",ref:"附件3·二（各癌种可选项目）",doc:4},
 "糖类抗原19-9":{"d":"即 CA19-9，常用于胰腺癌相关评估，但单独用于无症状人群筛查证据不足。",q:"胰腺癌　优先推荐：糖类抗原19-9、胰腺增强CT",ref:"附件3·二（胰腺癌优先推荐）",doc:4},
 "糖类抗原125":{"d":"即 CA125，卵巢癌相关标志物。大型随机研究显示以其为主的筛查并未降低卵巢癌死亡率。",q:"卵巢癌　优先推荐：阴道超声、糖类抗原125、人附睾蛋白4",ref:"附件3·二（卵巢癌优先推荐）",doc:4},
 "人附睾蛋白4":{"d":"即 HE4，常与 CA125 联合用于卵巢癌评估，不用于普通人群筛查。",ref:"附件3·二（卵巢癌优先推荐）",doc:4},
 "胃蛋白酶原":{"d":"反映胃黏膜萎缩程度的血清指标。指南明确不建议单独用于胃癌筛查，只能用于高危人群风险分层。",q:"胃癌　可选项目：……血清胃蛋白酶原、血清胃泌素-17",ref:"附件3·二（胃癌可选项目）",doc:4},
 "胃泌素-17":{"d":"反映胃窦黏膜功能的血清指标。同样不建议单独用于胃癌筛查。",ref:"附件3·二（胃癌可选项目）",doc:4},
 "多靶点粪便DNA":{"d":"一种无创结直肠癌筛查方法，检测粪便中的肿瘤 DNA，适合不愿意做肠镜的人，阳性仍需肠镜确认。",q:"结肠癌　可选项目：乙状结肠镜、结肠CT、多靶点粪便DNA检测",ref:"附件3·二（结肠癌可选项目）",doc:4},
 "SPPB":{"d":"简易体能状况量表，通过平衡、步速、起坐三项评估老年人下肢功能，是老年综合评估的常用工具。",ref:"WS/T 888-2026《医疗机构老年综合评估技术操作标准》·躯体功能（该标准原文未公开，此处只标注文档与章节）",doc:9},
 "TUG":{"d":"计时起立行走测试：从椅子上站起、走 3 米、转身、回到椅子坐下，计时。用时越长提示跌倒风险越高。",ref:"WS/T 887-2026《社区老年人跌倒预防控制技术标准》·跌倒风险评估（该标准原文未公开）",doc:10},
 "洼田饮水试验":{"d":"让老人喝下 30ml 温水，观察呛咳和分次情况，用于筛查吞咽功能障碍。",ref:"WS/T 888-2026·老年综合征（吞咽功能）",doc:9},
 "ICIQ-SF":{"d":"国际尿失禁咨询委员会简表，用于评估尿失禁的频次和影响程度。",ref:"WS/T 888-2026·老年综合征（尿失禁）",doc:9},
 "阿森斯失眠量表":{"d":"即 AIS，评估入睡困难、夜间觉醒、早醒、睡眠时间等，用于量化失眠程度。",ref:"WS/T 888-2026·老年综合征（睡眠）",doc:9},
 "Braden":{"d":"Braden 压疮风险评估量表，从感知、活动、移动、营养、潮湿、摩擦力六方面评估压力性损伤风险。",ref:"WS/T 888-2026·老年综合征（压力性损伤）",doc:9},
 "NRS评分":{"d":"数字评分法，让本人用 0–10 分描述疼痛程度，0 为无痛、10 为最剧烈。",ref:"WS/T 888-2026·老年综合征（慢性疼痛）",doc:9},
 "MoCA":{"d":"蒙特利尔认知评估量表，对轻度认知障碍较敏感，是认知筛查的常用工具。",q:"认知功能障碍　优先推荐：简易精神状态检查量表、蒙特利尔认知评估量表、8条目痴呆筛查问卷……",ref:"附件3·三（认知功能障碍优先推荐）",doc:4},
 "MMSE":{"d":"简易精神状态检查量表，经典的认知功能筛查工具。",ref:"附件3·三（认知功能障碍优先推荐）",doc:4},
 "AD8":{"d":"8 条目痴呆筛查问卷，由知情者（通常是家属）回答，用于快速识别认知下降。",ref:"附件3·三（认知功能障碍优先推荐）",doc:4},

 "高风险人群":{"d":"指根据年龄、家族史、生活方式、既往疾病等条件综合判断，患病风险明显高于一般人群的群体。本工具的核心逻辑就是先判定风险人群，再匹配合适的筛查项目。",q:"（二）健康体检机构根据常见慢性病风险评估指标（附件5），筛选慢性病风险人群，选择筛查项目。",ref:"《成人健康体检项目推荐指引（2025年版）》三、注意事项（二）",doc:1},

var GLOSSARY_MORE2 = {

 "痴呆":{"d":"以获得性认知功能全面下降为特征，影响记忆、语言、判断和日常生活能力。阿尔茨海默病是最常见的原因。",ref:"附件5·十三、认知功能障碍筛查风险人群",doc:6},

 "周围神经病变":{"d":"糖尿病等引起的四肢末端神经损伤，表现为手脚麻木、刺痛、感觉减退。足部感觉丧失容易导致溃疡。",ref:"附件3·三（2型糖尿病可选项目：足部与神经病变筛查）",doc:4},

    P.metrics.push({v:""+(Math.round(m.bmi*10)/10),k:"BMI"+(m.bmi>=28?" 肥胖":m.bmi>=24?" 超重":" 正常"),c:bc}); }
  if(num(a.waist)!==null) P.metrics.push({v:""+a.waist,k:"腰围 cm"+(R.central?" 超标":""),c:R.central?"warn":"ok"});
  if(m.bp) P.metrics.push({v:a.sbp+"/"+a.dbp,k:m.bp.t,c:m.bp.c});
  if(m.dmScore!==null) P.metrics.push({v:""+m.dmScore,k:"糖尿病评分"+(m.dmScore>=25?" 高风险":""),c:m.dmScore>=25?"warn":"ok"});
  if(m.copdScore!==null) P.metrics.push({v:""+m.copdScore,k:"COPD 评分"+(m.copdScore>=16?" 高风险":""),c:m.copdScore>=16?"warn":"ok"});
  if(m.crcScore!==null) P.metrics.push({v:""+m.crcScore,k:"结直肠癌评分"+(m.crcScore>=4?" 高风险":""),c:m.crcScore>=4?"warn":"ok"});

  function rdef(k){ for(var j=0;j<RISK_DEFS.length;j++) if(RISK_DEFS[j].key===k) return RISK_DEFS[j]; return null; }
  P.risksHi = R.risks.filter(function(x){return x.lvl==="high";}).map(function(x){ var d=rdef(x.k); return {k:x.k, name:d?d.name:x.k, why:x.why, src:d?fullSrc(d.risk):""}; });
  P.risksWa = R.risks.filter(function(x){return x.lvl!=="high";}).map(function(x){ var d=rdef(x.k); return {k:x.k, name:d?d.name:x.k, why:x.why, src:d?fullSrc(d.risk):""}; });
  P.warns = R.warn.slice();

  var basics=BASIC_GROUPS.slice();
  for(var c2=0;c2<BASIC_COND.length;c2++) if(BASIC_COND[c2].when(a)) basics.push({g:BASIC_COND[c2].g, src:BASIC_COND[c2].src, list:BASIC_COND[c2].list});
  P.tiers.push({cls:"b", title:"基础项目（所有成年人都应完成）", groups:basics.map(function(x){return {g:x.g, src:fullSrc(x.src), list:x.list.slice(), note:""};})});

  var pg=[], og=[], seen={};
  R.risks.forEach(function(x){
    var d=rdef(x.k); if(!d) return;
    if(d.pri.length && !seen[x.k+"p"]){ pg.push({g:d.name, src:fullSrc(d.cite)+" —「优先推荐」", list:d.pri.slice(), note:d.note||""}); seen[x.k+"p"]=1; }
    if(d.opt.length && !seen[x.k+"o"]){ og.push({g:d.name+" · 可选", src:fullSrc(d.cite)+" —「可选项目」", list:d.opt.slice(), note:""}); seen[x.k+"o"]=1; }
  });
  if(pg.length) P.tiers.push({cls:"p", title:"重点加查（根据您的风险）", groups:pg});
  if(og.length) P.tiers.push({cls:"o", title:"可选项目（与医生商量后决定）", groups:og});

  if(num(a.age)>=74) P.notes.push("您已满 74 岁：国内各癌症筛查方案的目标人群上限一般为 74 岁。是否需要继续做胃肠镜、低剂量 CT 等，应与医生结合身体状况和预期寿命一起决定，不是做得越多越好。");
  if(num(a.age)>=75) P.notes.push("75 岁以上：多数筛查和预防用药的证据不足，过度检查带来的假阳性、过度治疗和身体负担可能大于收益。建议优先做好血压、血糖、用药梳理、跌倒预防、听力与口腔照护、疫苗接种。");
  if(R.metrics.frailty>=1&&num(a.age)>=60) P.notes.push("存在衰弱或衰弱前期：筛查决策应先评估预期寿命与身体耐受能力。国际共识认为预期寿命不足 10 年时，不建议再做癌症筛查。");
  if(has(a.dx,"糖尿病")) P.notes.push("已确诊糖尿病：重点应放在并发症筛查（眼底、尿微量白蛋白、足部与神经病变、心脑血管），而不是反复做诊断性检查。");
  if(num(a.med_count)>=5) P.notes.push("正在服用 5 种以上药物：建议请医生或药师做一次用药核查，减少不适当用药与跌倒风险。");

  P.elder = R.elder.filter(function(e){return e.t;}).map(function(e){ return {t:e.t, lvl:e.lvl}; });
  P.elderItems = ELDER_ITEMS;
  return P;
}

{n:1, status:"full", title:"《成人健康体检项目推荐指引（2025年版）》通知正文及指引正文",
 meta:"国家卫生健康委办公厅　国卫办医政函〔2025〕412号　2025年10月28日",
 body:"国家卫生健康委办公厅关于印发成人健康体检项目推荐指引（2025年版）的通知\n国卫办医政函〔2025〕412号\n\n各省、自治区、直辖市及新疆生产建设兵团卫生健康委：\n为进一步规范健康体检行为，维护受检者健康权益，我委组织制定了《成人健康体检项目推荐指引（2025年版）》。现印发给你们，供各级卫生健康行政部门和相关医疗机构在成人健康体检工作中参照使用。\n\n国家卫生健康委办公厅\n2025年10月28日\n（信息公开形式：主动公开）\n\n----------------------------------------\n成人健康体检项目推荐指引（2025年版）\n\n为指导健康体检机构合理设置健康体检项目，制定《成人健康体检项目推荐指引（2025年版）》（以下简称《指引》）。\n\n一、适用范围\n本《指引》所称健康体检是指通过医学手段和方法对受检者进行身体检查，了解受检者健康状况、早期发现疾病线索和健康隐患的诊疗行为。不包括职业健康检查、从业人员健康体检、入学、入伍、结婚登记等国家规定的专项体检、基本公共卫生服务项目提供的健康体检、孕前优生健康检查以及专项疾病的筛查和普查等。\n本《指引》适用于18岁及以上的成年人群健康体检。\n\n二、主要内容\n（一）健康体检自测问卷（附件1）。引导受检者如实填写健康体检自测问卷，了解受检者基本健康状况，对疾病风险进行初步评估，合理设置体检项目。健康体检自测问卷包括：个人基本信息、既往史及家族史、生活方式信息和心理健康状况等。\n（二）基本体检项目（附件2）。包括体格检查、实验室检查、辅助检查等。\n体格检查包括：一般检查和物理检查两部分。一般检查包括身高、体重、腰围/臀围、血压、脉率；物理检查包括内科、外科、眼科、耳鼻咽喉科、口腔科、妇科（有性生活史）检查。\n实验室检查包括：常规检查、生化检查、甲状腺功能检查、分子检查和细胞学检查。常规检查包括血常规、尿常规、粪便常规+隐血试验；生化检查包括肝功能、肾功能、血脂、血糖、血尿酸、血同型半胱氨酸；甲状腺功能检查包括促甲状腺激素、游离甲状腺激素；分子检查主要是指高危型HPV核酸检测；细胞学检查主要是指子宫颈细胞学检查。\n辅助检查包括：心电图检查、放射检查、超声检查、人体成分分析。40岁以上人群，增加肺功能检查和骨密度检测。\n（三）慢性病风险筛查项目（附件3）。在基本体检项目的基础上，结合健康体检自测问卷，对存在心脑血管疾病、常见恶性肿瘤、慢性呼吸系统疾病、糖尿病等疾病风险的人群，根据相应慢性病筛查与早诊早治方案等，增加个性化深度检查项目。\n\n三、注意事项\n（一）健康体检机构可参照《成人健康体检工作流程图（2025年版）》（附件4）开展工作，在设置健康体检项目时，可结合受检者健康服务需求及本机构技术人员专业结构、医疗设备配置情况等，对体检项目进行合理调整。\n（二）健康体检机构根据常见慢性病风险评估指标（附件5），筛选慢性病风险人群，选择筛查项目。\n（三）鼓励健康体检机构充分运用信息技术，为健康体检和健康管理服务提供支持。"},

{n:2, status:"full", title:"《成人健康体检项目推荐指引（2025年版）》附件1　健康体检自测问卷",
 meta:"《成人健康体检项目推荐指引（2025年版）》附件1",
 body:"健康体检自测问卷（2025年版）\n（请根据您的实际情况，在选项前方框内打“√”）\n\n【个人基本信息】\n姓名　性别（男/女）　出生日期　联系电话　国籍　民族　证件类型　证件号码　受教育程度　婚姻状态　职业　家庭常住地址（省/市/区县，居住时长　年）\n证件类型：1.居民身份证；2.中国人民解放军军人身份证件；3.中国人民武装警察身份证件；4.港澳居民来往内地通行证；5.台湾居民来往大陆通行证；6.护照；7.外国人永久居住证；9.其他。\n受教育程度：研究生及以上／大学本科·专科／中专·技校／高中／初中／小学及以下\n婚姻状态：未婚／已婚／丧偶／离婚／其他\n职业：国家公务员／专业技术人员／职员／企业管理人员／工人／农民／学生／现役军人／自由职业者／个体经营者／无业人员／退（离）休人员／其他\n\n【既往史及家族史】\n疾病名称（既往史：有／无；患病时长；已用药；是否遵医嘱按时服药；家族史：有／无）：\n糖尿病、高血压、血脂异常、冠心病、脑血管病、慢性阻塞性肺疾病、慢性肾脏病、高尿酸血症/痛风、恶性肿瘤（名称）、其他疾病\n本人过敏史：无／有\n本人手术史：无／有\n\n【生活方式信息】\n吸烟情况：不吸烟／不吸烟但有被动吸烟／吸电子烟／吸烟（吸烟__年，每日平均__支）／已戒烟\n饮酒频率：从不饮酒／每月≤1次／每月2-4次／每周2-3次／每周≥4次\n平均1天饮酒量：白酒（＜1.5两／≥1.5两且＜2.5两／≥2.5两且＜3.5两／≥3.5两且＜5两／≥5两）；啤酒（＜1000ml／≥1000ml且＜1500ml／≥1500ml且＜2500ml／≥2500ml且＜3500ml／≥3500ml）；葡萄酒·黄酒·米酒（＜300ml／≥300ml且＜500ml／≥500ml且＜700ml／≥700ml且＜1000ml／≥1000ml）\n注：白酒1两约2单位；啤酒500ml约1.5单位；葡萄酒/黄酒/米酒100ml约1单位\n每次饮酒≥6单位的频率：从不／每月小于1次／每月1次／每周1次／每天或几乎每天\n注：6单位相当于每次白酒≥3两，或啤酒≥2000ml，或葡萄酒/黄酒/米酒≥600ml\n饮食习惯：荤素均衡／荤食为主／素食为主\n饮食口味：多盐／多油／多糖／辛辣／清淡\n睡眠：每天夜间睡眠时长__小时，午睡__分钟，睡眠质量：较好／一般／较差\n运动：每周高强度活动__次、每次__分钟；每周中等强度活动__次、每次__分钟；每周步行__次、每次__分钟\n每天累积坐着或躺着（不包括睡觉时间）__小时__分钟\n\n【广泛性焦虑自评量表（选做项目）】\n在过去两个星期，有多少时间您被以下问题所困扰？（完全不会／几天／一半以上的日子／几乎每天）\n1.感觉紧张、焦虑或烦躁\n2.不能停止或控制担忧\n3.对各种各样的事情担忧过多\n4.很难放松下来\n5.由于不安而无法静坐\n6.变得容易烦恼或急躁\n7.害怕将有可怕的事发生\n\n【抑郁自评量表（选做项目）】\n在过去两个星期，有多少时间您被以下问题所困扰？（完全不会／几天／一半以上的日子／几乎每天）\n1.做什么事都感到没有兴趣或乐趣\n2.感到心情低落\n3.入睡困难、很难熟睡或睡太多\n4.感到疲劳或无精打采\n5.胃口不好或吃太多\n6.觉得自己很糟，或很失败，或让自己或家人失望\n7.注意很难集中，例如阅读报纸或看电视\n8.动作或说话速度缓慢到别人可察觉的程度，或正好相反——您烦躁或坐立不安，动来动去的情况比平常更严重\n9.有不如死掉或用某种方式伤害自己的念头\n\n（说明：以上为原表文字，原文以表格与勾选框形式呈现；此处按段落换行整理，文字未作改动。）"},

{n:3, status:"full", title:"《成人健康体检项目推荐指引（2025年版）》附件2　基本体检项目",
 meta:"《成人健康体检项目推荐指引（2025年版）》附件2",
 body:"基本体检项目（2025年版）\n\n【体格检查】\n一般检查：身高、体重、腰围/臀围、血压、脉率\n物理检查：\n　内科：肺部、心脏、腹部等\n　外科：皮肤、浅表淋巴结、头颈、甲状腺、乳腺（女性）、脊柱、四肢、关节、肛诊、外生殖器（男性）\n　眼科：视力（裸眼/矫正视力）、眼压、眼附属器、眼前节、眼底检查\n　耳鼻咽喉科：外耳道、鼓膜、听力、鼻腔、鼻窦、咽喉\n　口腔科：口腔黏膜、牙齿、牙龈、颞颌关节、腮腺\n　妇科（有性生活史）：外阴、内诊\n\n【实验室检查】\n常规检查：血常规、尿常规、粪便常规+隐血试验\n生化检查：\n　肝功能：丙氨酸氨基转移酶、天门冬氨酸氨基转移酶、总胆红素、直接胆红素、间接胆红素、总蛋白、白蛋白、球蛋白、γ-谷氨酰转肽酶、碱性磷酸酶\n　肾功能：尿素氮、肌酐\n　血脂：总胆固醇、甘油三酯、低密度脂蛋白胆固醇、高密度脂蛋白胆固醇\n　血糖：空腹血糖、糖化血红蛋白\n　血尿酸\n　血同型半胱氨酸\n甲状腺功能检查：促甲状腺激素、游离甲状腺激素\n分子检查：高危型HPV核酸检测\n细胞学检查：子宫颈细胞学检查\n\n【辅助检查】\n心电图检查：十二导联心电图\n放射检查：胸部正位片或正侧位片：肺部、心脏、胸廓、纵隔\n超声检查：腹部超声（肝、胆、胰、脾、肾）；女性：子宫、附件、乳腺\n人体成分分析：体脂率、肌肉脂肪分布情况\n肺功能检查：40岁以上人群\n骨密度检测：40岁以上人群"},

{n:4, status:"full", title:"《成人健康体检项目推荐指引（2025年版）》附件3　慢性病风险筛查项目",
 meta:"《成人健康体检项目推荐指引（2025年版）》附件3",
 body:"慢性病风险筛查项目（2025年版）\n\n一、心脑血管疾病风险人群筛查项目\n■ 高血压\n　优先推荐：动态血压、超声心动图、颈动脉超声\n　可选项目：眼底照相、尿微量白蛋白/肌酐比值、经颅多普勒、踝肱指数、脉搏波传导速度、冠状动脉CTA、头颅CT/MRI、磁共振脑血管成像、睡眠呼吸监测、动态心电图、超敏C反应蛋白、肾动脉超声、血钾、血钠、血浆肾素浓度、血醛固酮、醛固酮/肾素浓度比值、24h尿钾、24h尿钠、24h尿醛固酮、肾上腺CT\n■ 冠心病\n　优先推荐：颈动脉超声、超声心动图、冠脉钙化积分、动态心电图、高敏肌钙蛋白\n　可选项目：肌酸激酶、肌酸激酶同工酶、载脂蛋白A1、载脂蛋白B、脂蛋白（a）、超敏C反应蛋白、冠状动脉CTA、踝肱指数、脉搏波传导速度、B型脑钠肽/N末端B型脑钠肽前体\n■ 脑卒中\n　优先推荐：头颅CT、颈动脉超声、超声心动图、动态血压、动态心电图、经颅多普勒\n　可选项目：头颅MRI、磁共振脑血管成像、头颅CTA、颈部CTA、睡眠呼吸监测\n\n二、常见恶性肿瘤风险人群筛查项目\n■ 肺癌　优先推荐：胸部低剂量CT；可选项目：胃泌素释放肽前体、神经元特异性烯醇化酶、细胞角蛋白19片段、鳞状细胞癌抗原、肺癌相关自身抗体、异常糖链糖蛋白\n■ 结肠癌　优先推荐：结肠镜；可选项目：乙状结肠镜、结肠CT、多靶点粪便DNA检测\n■ 胃癌　优先推荐：胃镜；可选项目：磁控胶囊胃镜检查、胃超声、幽门螺杆菌检测、血清胃蛋白酶原、血清胃泌素-17\n■ 肝癌　优先推荐：甲胎蛋白、甲胎蛋白异质体、异常凝血酶原；可选项目：癌胚抗原、糖类抗原19-9、肝脏增强CT或MRI、肝脏瞬时弹性成像、异常糖链糖蛋白\n■ 乳腺癌　优先推荐：乳腺X线检查；可选项目：乳腺MRI、乳腺热层析成像、BRCA基因检测、异常糖链糖蛋白\n■ 前列腺癌　优先推荐：前列腺超声、总前列腺特异性抗原、游离前列腺特异性抗原、游离前列腺特异性抗原与总前列腺特异性抗原比值；可选项目：前列腺MRI\n■ 食管癌　优先推荐：普通白光内镜；可选项目：色素内镜，对于发现的可疑病灶可采用特殊内镜技术（窄带成像技术结合放大内镜、蓝激光成像放大内镜、激光共聚焦显微内镜、荧光内镜等）、胸部增强CT\n■ 甲状腺癌　优先推荐：甲状腺及颈部淋巴结超声；可选项目：甲状腺球蛋白、降钙素、癌胚抗原、抗甲状腺过氧化物酶抗体、抗甲状腺球蛋白抗体、甲状腺CT\n■ 卵巢癌　优先推荐：阴道超声、糖类抗原125、人附睾蛋白4；可选项目：甲胎蛋白、人绒毛膜促性腺激素、神经元特异性烯醇化酶、乳酸脱氢酶、糖类抗原19-9、癌胚抗原\n■ 胰腺癌　优先推荐：糖类抗原19-9、胰腺增强CT；可选项目：癌胚抗原、糖类抗原125、胰腺MRI\n\n三、其他慢性病风险人群筛查项目\n■ 慢性阻塞性肺疾病　优先推荐：肺功能检查；可选项目：脉搏氧饱和度监测、心肺运动测试、超声心动图、胸部CT\n■ 2型糖尿病　优先推荐：口服葡萄糖耐量试验；可选项目：眼底照相、尿微量白蛋白/肌酐比值、糖化白蛋白、颈动脉超声、下肢动脉超声、超声心动图、经颅多普勒、踝肱指数、脉搏波传导速度、冠状动脉CTA、头颅CT/MRI、磁共振脑血管成像、脂联素\n■ 骨质疏松　优先推荐：双能X线骨密度、定量CT；可选项目：血清骨代谢指标（I型前胶原氨基端前肽、I型胶原C端交联肽、抗酒石酸酸性磷酸酶、碱性磷酸酶等）、25羟基维生素D、甲状旁腺素、血钙、血磷、24h尿钙、24h尿钠、血清蛋白电泳\n■ 慢性肾病　优先推荐：尿微量白蛋白/肌酐比值、血清胱抑素C；可选项目：肾小管功能检测（尿β2-微球蛋白、尿视黄醇结合蛋白、尿α1-微球蛋白、尿N-乙酰-β-葡萄糖苷酶）、24h尿蛋白定量\n■ 肥胖　优先推荐：血糖（餐后2h）、胰岛素（空腹、餐后2h）；可选项目：睡眠呼吸监测、促肾上腺皮质激素、皮质醇、卵泡刺激素、促黄体生成素、雌二醇、孕酮、泌乳素、睾酮、硫酸脱氢表雄酮、雄烯二酮、性激素结合球蛋白、动态血压、抗缪勒管激素(育龄期女性)、中医体质辨识、口服葡萄糖耐量试验\n■ 认知功能障碍　优先推荐：简易精神状态检查量表、蒙特利尔认知评估量表、8条目痴呆筛查问卷、神经精神症状筛查、ApoE基因检测；可选项目：头颅MRI、红细胞沉降率、电解质、维生素B12、叶酸"},

{n:6, status:"full", title:"《成人健康体检项目推荐指引（2025年版）》附件5　常见慢性病风险评估指标",
 meta:"《成人健康体检项目推荐指引（2025年版）》附件5",
 body:"常见慢性病风险评估指标（2025年版）\n\n一、心血管病风险人群\n符合以下条件者，为心血管病高风险人群。\n（一）对于没有动脉粥样硬化性心血管疾病（ASCVD）的人群，符合如下3个条件之一者，直接列为高风险人群：\n1.低密度脂蛋白胆固醇≥4.9mmol/L或总胆固醇≥7.2mmol/L；\n2.年龄≥40岁的糖尿病患者；\n3.慢性肾脏病3-4期。\n（二）不具有上述情况的个体应进行未来10年间ASCVD总体发病风险的评估，10年发病平均风险为高危的人群，为心血管病高风险人群。\n（三）对于ASCVD 10年发病风险为中危的人群，如果年龄<55岁，则需进行ASCVD余生风险的评估，评估为高危的为心血管病高风险人群。\n\n二、糖尿病风险人群\n符合以下条件之一者，为糖尿病高风险人群。\n（一）有糖尿病前期史；（二）年龄≥35岁；（三）体重指数≥24kg/m2和（或）中心型肥胖（男性腰围≥90cm，女性腰围≥85cm）；（四）一级亲属（父母、子女以及兄弟姐妹）有糖尿病史；（五）缺乏体力活动者；（六）有巨大儿分娩史或有妊娠期糖尿病病史；（七）有多囊卵巢综合征病史；（八）有黑棘皮病者；（九）有高血压史，或正在接受降压治疗者；（十）高密度脂蛋白胆固醇<0.90mmol/L和（或）甘油三酯>2.22mmol/L，或正在接受调脂药治疗者；（十一）有动脉粥样硬化性心血管疾病史；（十二）有代谢相关脂肪性肝病者；（十三）有胰腺炎病史；（十四）接受抗病毒治疗的艾滋病患者；（十五）有类固醇类药物使用史；（十六）长期接受抗精神病药物或抗抑郁症药物治疗；（十七）中国糖尿病风险评分总分≥25分。\n\n中国糖尿病风险评分表\n评分指标（分值）：\n年龄（岁）：20~24（0）／25~34（4）／35~39（8）／40~44（11）／45~49（12）／50~54（13）／55~59（15）／60~64（16）／65~74（18）\n收缩压（mmHg）：<110（0）／110~119（1）／120~129（3）／130~139（6）／140~149（7）／150~159（8）／≥160（10）\n体重指数（kg/m2）：<22.0（0）／22.0~23.9（1）／24.0~29.9（3）／≥30.0（5）\n腰围（cm）：男<75.0、女<70.0（0）／男75.0~79.9、女70.0~74.9（3）／男80.0~84.9、女75.0~79.9（5）／男85.0~89.9、女80.0~84.9（7）／男90.0~94.9、女85.0~89.9（8）／男≥95.0、女≥90.0（10）\n糖尿病家族史（父母、子女以及兄弟姐妹）：无（0）／有（6）\n性别：女（0）／男（2）\n\n三、慢性阻塞性肺疾病（COPD）风险人群\n以下各项累计评分≥16分者，为COPD高风险人群。\n1.您的年龄：40-49岁（0）／50-59岁（4）／60-69岁（8）／≥70岁（11）\n2.您的吸烟总量（吸烟总量=每天吸烟（包）×吸烟（年））：从不吸烟（0）／1-14包年（2）／15-29包年（4）／≥30包年（5）\n3.您的体重指数（=体重(kg)/身高²(m²)）：<18.5（7）／18.5-23.9（4）／24.0-27.9（1）／≥28.0（0）\n4.没有感冒时您是否常有咳嗽：是（5）／否（0）\n5.您平时是否感觉有气促：没有气促（0）／在平地急行或爬小坡时感觉气促（3）／平地正常行走时感觉气促（6）\n6.您主要使用过生物燃料烹饪吗（生物燃料指利用生物体制取的燃料，比如玉米秆、玉米芯等）：是（1）／否（0）\n7.您的父母、子女以及兄弟姐妹是否有人患支气管哮喘、慢性支气管炎、肺气肿或慢阻肺：是（3）／否（0）\n\n四、肺癌风险人群\n年龄≥50岁，且符合以下任意一项者为肺癌高风险人群。\n（一）吸烟包年数≥20包年，包括曾经吸烟≥20包年，但戒烟不足15年。注：吸烟包年数=每天吸烟的包数（每包20支）×吸烟年数；\n（二）与吸烟人群共同生活或同室工作≥20年；\n（三）患有慢性阻塞性肺疾病；\n（四）有职业暴露史（石棉、氡、铍、铬、镉、镍、硅、煤烟和煤烟尘等）至少1年；\n（五）有一级亲属（父母、子女以及兄弟姐妹）确诊肺癌。\n\n五、结直肠癌风险人群\n（一）散发性结直肠癌高风险人群：以下各项累计评分≥4分者，为结直肠癌高风险人群。\n1.年龄：≤49岁（0分），50-59岁（1分），≥60岁（2分）；\n2.性别：女性（0分），男性（1分）；\n3.吸烟史：无（0分），有（1分）；\n4.体重指数：<23kg/m2（0分），≥23kg/m2（1分）；\n5.一级亲属（父母、子女以及兄弟姐妹）确诊结直肠癌：无（0分），有（1分；其中，如有1个一级亲属<60岁时被确诊为结直肠癌，或者2个一级亲属确诊结直肠癌4分）。\n（二）遗传性结直肠癌高风险人群：具有林奇综合征或患有家族性腺瘤性息肉病等的人群。\n\n六、胃癌风险人群\n年龄≥45岁，且符合以下任意一项者，为胃癌高风险人群；\n（一）居住于胃癌高发地区（以县级行政区为单位界定，以2000年中国人口结构为标准的年龄标化发病率>20/10万）；\n（二）一级亲属（父母、子女以及兄弟姐妹）中有胃癌病史；\n（三）尿素呼气试验、血清幽门螺杆菌抗体、粪便幽门螺杆菌抗原检测任一阳性；\n（四）吸烟、重度饮酒、高盐饮食、腌制食品等不良生活方式和饮食习惯；\n（五）患有慢性萎缩性胃炎、胃溃疡、胃息肉、手术后残胃、肥厚性胃炎、恶性贫血等疾病。\n\n七、肝癌风险人群\n肝癌高危人群主要包括：具有乙型肝炎病毒和/或丙型肝炎病毒感染、过度饮酒、肝脂肪变性或代谢功能障碍相关性肝病、饮食中黄曲霉毒素B1的暴露、其他各种原因引起的肝硬化及有肝癌家族史等人群，尤其年龄＞40岁的男性。\n\n八、乳腺癌风险人群\n符合以下任一条件者，为乳腺癌高风险人群。\n（一）有遗传家族史，即具备以下任意一项者：1.一级亲属（父母、子女以及兄弟姐妹）有乳腺癌或卵巢癌史；2.二级亲属50岁前，患乳腺癌2人及以上；3.二级亲属50岁前，患卵巢癌2人及以上；4.至少1位一级亲属携带已知BRCA1/2基因致病性遗传突变；或自身携带BRCA1/2基因致病性遗传突变。\n（二）具备以下任意一项者：1.月经初潮年龄≤12岁；2.绝经年龄≥55岁；3.有乳腺活检史或乳腺良性疾病手术史，或病理证实的乳腺（小叶或导管）不典型增生病史；4.使用“雌孕激素联合”的激素替代治疗不少于半年；5.45岁后乳腺X线检查提示乳腺实质(或乳房密度)类型为不均匀致密型或致密型。\n（三）具备以下任意两项者：1.无哺乳史或哺乳时间<4个月；2.无活产史(含从未生育、流产、死胎)或初次活产年龄>30岁；3.仅使用“雌激素”的激素替代治疗不少于半年；4.流产(含自然流产和人工流产)≥2次。\n\n九、前列腺癌风险人群\n符合下列条件之一的男性，为前列腺癌高风险人群。\n（一）年龄≥60岁；（二）年龄≥45岁且有前列腺癌家族史；（三）携带BRCA2基因突变且年龄≥40岁。\n\n十、卵巢癌风险人群\n符合下列条件之一的女性，为卵巢癌高风险人群。\n（一）有乳腺癌和卵巢癌家族史；（二）BRCA1和BRCA2胚系突变携带者；（三）林奇综合征、利–弗劳梅尼综合征家族的女性。\n\n十一、食管癌风险人群\n年龄≥45岁，且符合以下任意一项者为食管癌高风险人群。\n（一）居住于食管癌高发地区（以县级行政区为单位界定，以2000年中国人口结构为标准的年龄标化发病率>15/10万）；\n（二）父母、子女以及兄弟姐妹等一级亲属中有食管癌病史；\n（三）热烫饮食、高盐饮食、腌制食品、吸烟、重度饮酒等不良饮食习惯和生活方式；\n（四）患有慢性食管炎、巴雷特食管、食管憩室、贲门失弛缓症、反流性食管炎、食管良性狭窄等疾病；\n（五）有食管的癌前病变诊疗史。\n\n十二、甲状腺癌风险人群\n符合下列条件之一的，为甲状腺癌高风险人群。\n（一）童年期头颈部放射线照射史或放射性尘埃接触史；\n（二）全身放射治疗史；\n（三）分化型甲状腺癌、甲状腺髓样癌或多发性内分泌腺瘤病Ⅱ型、家族性多发性息肉病、某些甲状腺癌综合征（如多发性错构瘤综合征、卡尼综合征、维尔纳综合征和加德纳综合征等）的既往史或家族史。\n\n十三、认知功能障碍筛查风险人群\n（一）推荐≥50岁的人群开展脑认知健康筛查；\n（二）在伴有痴呆危险因素、认知障碍家族史及主观认知下降的人群中，筛查年龄可提前至40岁或根据个体化情况及早筛查。"},

{n:7, status:"full", title:"《老年人健康管理服务规范（2026年）》",
 meta:"国家基本公共卫生服务项目　地方卫生健康委公开文本",
 body:"老年人健康管理服务规范（2026年）\n\n一、服务对象\n辖区内65岁及以上常住居民。\n\n二、服务内容\n每年为老年人提供1次健康管理服务，包括生活方式和健康状况评估、体格检查、辅助检查和健康指导。\n（一）生活方式和健康状况评估。通过问诊及老年人健康状态自评了解其基本健康状况、体育锻炼、饮食、吸烟、饮酒、慢性疾病常见症状、既往所患疾病、治疗及目前用药和生活自理能力等情况。\n（二）体格检查。包括体温、脉搏、呼吸、血压、身高、体重、腰围、皮肤、浅表淋巴结、肺部、心脏、腹部等常规体格检查，并对口腔、视力、听力和运动功能等进行粗测判断。\n（三）辅助检查。包括血常规、尿常规、肝功能（血清谷草转氨酶、血清谷丙转氨酶和总胆红素）、肾功能（血清肌酐和血尿素）、空腹血糖、血脂（总胆固醇、甘油三酯、低密度脂蛋白胆固醇、高密度脂蛋白胆固醇）、心电图和腹部B超（肝胆胰脾）检查。\n（四）健康指导。告知评价结果并进行相应健康指导。\n1.对发现已确诊的原发性高血压和2型糖尿病等患者同时开展相应的慢性病患者健康管理。\n2.对患有其他疾病的（非高血压或糖尿病），应及时治疗或转诊。\n3.对发现有异常的老年人建议定期复查或向上级医疗机构转诊。\n4.进行健康生活方式以及疫苗接种、骨质疏松预防、防跌倒措施、意外伤害预防和自救、认知和情感等健康指导。\n5.告知或预约下一次健康管理服务的时间。\n\n三、服务流程（原文为流程图）\n\n四、服务要求\n（一）开展老年人健康管理服务的乡镇卫生院和社区卫生服务中心应当具备服务内容所需的基本设备和条件。\n（二）加强与村（居）委会、派出所等相关部门的联系，掌握辖区内老年人口信息变化。加强宣传，告知服务内容，使更多的老年人愿意接受服务。\n（三）每次健康检查后及时将相关信息记入健康档案。具体内容详见《居民健康档案管理服务规范》健康体检表。对于已纳入相应慢病健康管理的老年人，本次健康管理服务可作为一次随访服务。\n（四）积极应用中医药方法为老年人提供养生保健、疾病防治等健康指导。\n\n五、工作指标\n老年人健康管理率＝年内接受健康管理人数 / 年内辖区内65岁及以上常住居民数×100％。\n注：接受健康管理是指建立了健康档案、接受了健康体检、健康指导、健康体检表填写完整。"},

{n:8, status:"full", title:"国卫通〔2026〕2号《关于发布〈老年人认知障碍预防干预技术标准〉等7项推荐性卫生行业标准的通告》",
 meta:"国家卫生健康委　2026年2月28日发布　2026年9月1日施行",
 body:"中华人民共和国行业标准公告\n国卫通〔2026〕2号\n\n关于发布《老年人认知障碍预防干预技术标准》等7项推荐性卫生行业标准的通告\n\n现发布《老年人认知障碍预防干预技术标准》等7项推荐性卫生行业标准，编号和名称如下：\nWS/T 875-2026　老年人认知障碍预防干预技术标准\nWS/T 876-2026　医养结合健康管理服务标准\nWS/T 877-2026　医养结合健康教育服务标准\nWS/T 878-2026　老年人失能预防服务标准\nWS/T 887-2026　社区老年人跌倒预防控制技术标准\nWS/T 888-2026　医疗机构老年综合评估技术操作标准\nWS/T 889-2026　老年医学特色综合医院基本标准\n\n上述标准自2026年9月1日起施行。\n特此通告。\n\n国家卫生健康委\n2026年2月28日"},

{n:9, status:"part", title:"WS/T 888-2026《医疗机构老年综合评估技术操作标准》",
 meta:"国家卫生健康委发布　2026年9月1日施行　——　本工具未收录全文",
 body:"【全文未收录说明】\n该标准的正式文本为收费出版物，官方未公开发布全文，本工具无法收录。已核对到的官方公开信息如下：\n\n■ 发布依据：国卫通〔2026〕2号，2026年2月28日发布，2026年9月1日施行。\n\n■ 官方公布的适用范围与内容（通告/权威转载摘述）：\n适用于各级医疗机构。规定了老年综合评估的评估原则、对象、内容和方法（包括躯体功能、精神心理、社会与环境、老年综合征等），并明确了评估流程和质量控制要求。\n\n■ 本工具据此设计、并标注了对应章节名称的评估维度：\n· 躯体功能（ADL／IADL、SPPB）\n· 精神心理（认知、抑郁、焦虑）\n· 社会与环境（社会支持、居家环境）\n· 老年综合征（衰弱、肌少症、营养不良、多重用药、尿失禁、便秘、睡眠、疼痛、吞咽、跌倒等）\n\n■ 重要提醒：本工具只标注到“文档名＋章节名称”，未标注条款号，因为未取得标准原文。如需精确核对，请购买/查阅标准正式文本。"},

{n:10, status:"part", title:"WS/T 887-2026《社区老年人跌倒预防控制技术标准》",
 meta:"国家卫生健康委发布　2026年9月1日施行　——　本工具未收录全文",
 body:"【全文未收录说明】\n该标准的正式文本为收费出版物，官方未公开发布全文，本工具无法收录。已核对到的官方公开信息如下：\n\n■ 发布依据：国卫通〔2026〕2号，2026年2月28日发布，2026年9月1日施行。\n\n■ 官方公布的适用范围与内容（通告/权威转载摘述）：\n适用于社区老年人跌倒预防控制服务。规定了跌倒风险评估和分级、危险因素识别、预防控制措施（健康教育、运动锻炼、用药管理、居家环境改善、跌倒后现场救助）等内容。\n\n■ 本工具据此设计的评估项：跌倒史、走路是否稳、是否担心跌倒、4米步速／计时起立行走（TUG），并给出低／中／高三级风险提示。"},

{n:11, status:"part", title:"WS/T 875-2026《老年人认知障碍预防干预技术标准》",
 meta:"国家卫生健康委发布　2026年9月1日施行　——　本工具未收录全文",
 body:"【全文未收录说明】\n该标准的正式文本为收费出版物，官方未公开发布全文，本工具无法收录。已核对到的官方公开信息如下：\n\n■ 发布依据：国卫通〔2026〕2号，2026年2月28日发布，2026年9月1日施行。\n\n■ 官方公布的适用范围与内容（通告/权威转载摘述）：\n适用于基层医疗卫生机构、健康管理机构和医养结合机构等。规定了认知评估（推荐每12个月一次）、认知障碍预防（健康教育、身体活动、膳食指导、体重管理、控制“三高”、益智活动等）和认知障碍干预（每6个月随访，包括听力视力干预、认知训练、抑郁干预、中医适宜技术等），并要求与有诊断资质的医疗机构建立双向转诊绿色通道。\n\n■ 本工具据此设计的评估项：认知评估（提示每12个月一次）、抑郁初筛、焦虑初筛。"},

/* 网页「依据文件」清单与原文阅读器共用同一份编号清单，确保逐项标注能对上 */
SOURCES = DOCS.map(function(d){ return d.title; });

/* 以下两项由构建脚本注入：附件原文的带排版 HTML、以及可下载的源文件（base64） */
var DOCS_HTML = {};
var DOCFILES = {};


/* =========================== 挂号与科室指引 =========================== */
var DEPT_BY_KEY={
  cvd:"心血管内科", dm:"内分泌科", dm_dx:"内分泌科",
  copd:"呼吸内科", lung:"呼吸内科（肺癌筛查门诊）",
  crc:"消化内科（内镜中心）", gastric:"消化内科（内镜中心）",
  liver:"消化内科 / 肝病科（感染科）", esophageal:"消化内科（内镜中心）",
  breast:"乳腺外科（甲乳外科）", prostate:"泌尿外科",
  thyroid:"甲状腺外科 / 内分泌科", ovary:"妇科",
  cognition:"神经内科（记忆门诊）", osteoporosis:"内分泌科 / 骨科",
  ckd:"肾内科", obesity:"内分泌科 / 临床营养科",
  aaa:"血管外科"
};
var DEPT_TIPS=[
  "多数医院可先挂「健康体检中心 / 体检科」开单；胃镜、肠镜、低剂量 CT、MRI 等需要预约，部分医院要求先挂专科号才能开单。",
  "有「检前咨询门诊」或「健康管理门诊」的医院，可以直接把这份清单交给他们，一次配齐。",
  "老年人建议直接挂「老年医学科」：衰弱、肌少症、跌倒、营养、多重用药、认知与情绪这些评估，通常只有老年科能一次做全。",
  "检查前注意：抽血、腹部超声、胃镜需空腹；肠镜需肠道准备；做动态血压/动态心电图需预留 24 小时。",
  "带上正在服用的全部药物（含中药、保健品）清单或实物，方便医生做用药核查。"
];
function buildDepts(P){
  var out=[], seen={};
  function push(d, why){
    if(seen[d]!==undefined){ if(why && seen[d].indexOf(why)<0) seen[d].push(why); return; }
    seen[d]=why?[why]:[]; out.push({d:d, why:seen[d]});
  }
  push("健康体检中心 / 体检科", "");
  P.risksHi.concat(P.risksWa).forEach(function(x){ var d=DEPT_BY_KEY[x.k]; if(d) push(d, x.name); });
  if(num(A.age)>=60) push("老年医学科", "老年人综合评估（衰弱、肌少症、跌倒、营养、认知与情绪）");
  if(num(A.med_count)>=5) push("老年医学科 / 临床药学门诊", "多重用药核查");
  if(A.mem==="y"||A.mem_worry==="y") push("神经内科（记忆门诊）", "认知功能评估");
  if(A.mood1==="y"||A.mood2==="y") push("临床心理科", "情绪问题评估");
  if(A.hearing==="m"||A.hearing==="bad") push("耳鼻咽喉科", "听力评估");
  if(A.vision==="m"||A.vision==="bad") push("眼科", "视力与眼底检查");
  if(A.swallow==="y") push("康复医学科 / 耳鼻咽喉科", "吞咽功能评估");
  return out;
}

/* =========================== 长图导出（Canvas，无外部依赖） =========================== */
var IMG_FONT='"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Heiti SC",sans-serif';
var IMG_C={brand:"#0f7b5f",brandD:"#0b5f49",ink:"#16241f",muted:"#5c6f68",line:"#d9e4e0",
  amber:"#a35a06",amberL:"#fdf3e3",danger:"#b3261e",dangerL:"#fdeceb",gray:"#4b5a55",grayL:"#f1f5f4",white:"#ffffff"};

function fnt(size,weight){ return (weight?weight+" ":"")+size+"px "+IMG_FONT; }
function isLatin(ch){ var c=ch.charCodeAt(0);
  return (c>=48&&c<=57)||(c>=65&&c<=90)||(c>=97&&c<=122)||ch==="."||ch==="-"||ch==="_"||ch==="/"||ch==="%"; }

function imgWrap(mc,text,maxW,size,weight){
  mc.font=fnt(size,weight);
  text=String(text);
  var lines=[], cur="", buf="", i, ch;
  function addToken(tk){
    if(cur!=="" && mc.measureText(cur+tk).width>maxW){ lines.push(cur); cur=tk; }
    else cur+=tk;
  }
  for(i=0;i<text.length;i++){
    ch=text.charAt(i);
    if(ch==="\n"){ if(buf){addToken(buf);buf="";} lines.push(cur); cur=""; continue; }
    if(isLatin(ch)){ buf+=ch; continue; }
    if(buf){ addToken(buf); buf=""; }
    addToken(ch);
  }
  if(buf) addToken(buf);
  lines.push(cur);
  return lines;
}

function layoutResult(P,W,PAD,mc){
  var ops=[], y=0, CW=W-PAD*2, i, j;
  var C=IMG_C;
  function R(x,yy,w,h,r,f,s,sw){ ops.push({t:"r",x:x,y:yy,w:w,h:h,r:r||0,f:f,s:s,sw:sw||1.5}); }
  function LINES(lines,x,yy,size,weight,color,lh,align,maxW){
    ops.push({t:"t",x:x,y:yy,lines:lines,font:fnt(size,weight),color:color,lh:lh,align:align||"left",maxW:maxW});
    return lines.length*lh;
  }
  function T(str,x,yy,size,weight,color,lh,maxW,align){
    return LINES(imgWrap(mc,String(str),maxW||CW,size,weight),x,yy,size,weight,color,lh,align,maxW);
  }
  function H(str,yy){
    var n=imgWrap(mc,str,CW,25,"bold");
    return LINES(n,PAD,yy,25,"bold",C.brandD,34,"left",CW)+yy+12;
  }
  function metricBg(c){ return c==="bad"?C.dangerL:c==="warn"?C.amberL:C.grayL; }
  function liNum(num,txt,size,color,lh){
    ops.push({t:"t",x:PAD+6,y:y,lines:[num],font:fnt(size,"bold"),color:C.muted,lh:lh});
    return LINES(imgWrap(mc,txt,CW-32,size),PAD+30,y,size,"",color,lh);
  }
  function liDot(txt,size,color,lh){
    ops.push({t:"r",x:PAD+9,y:y+Math.round(lh*0.36),w:4,h:4,r:2,f:C.brand});
    return LINES(imgWrap(mc,txt,CW-32,size),PAD+24,y,size,"",color,lh);
  }
  function metricFg(c){ return c==="bad"?C.danger:c==="warn"?C.amber:C.brand; }

  /* ── 最上方：本测试依据声明（图片一开始就能看到） ── */
  var nl1=imgWrap(mc,"本测试依据《成人健康体检项目推荐指引（2025年版）》及其附件 1-5 进行，", CW-28, 16, "bold");
  var nl2=imgWrap(mc,"并参照《老年人健康管理服务规范（2026年）》等老年健康标准（共 "+SOURCES.length+" 份依据文件，详见本图末尾）。结果由 AI 生成整理，未经医学专业人员审核，仅供与医生沟通时参考。", CW-28, 14, "");
  var NH=12+nl1.length*22+4+nl2.length*20+12;
  R(0,0,W,NH,0,C.amberL);
  LINES(nl1,PAD,12,16,"bold","#6b4a12",22,CW-4);
  LINES(nl2,PAD,12+nl1.length*22+4,14,"","#6b4a12",20,CW-4);
  R(0,NH-3,W,3,0,C.amber);

  /* 顶部色带 */
  R(0,NH,W,132,0,C.brand);
  T("体检项目参考", PAD, NH+40, 34, "bold", "#ffffff", 44, CW);
  var sub="AI 生成整理  ｜  "+VERSION + (P.family?"（由家属代为填写）":"");
  T(sub, PAD, NH+92, 17, "", "rgba(255,255,255,.92)", 24, CW);

  /* AI 生成声明（醒目横幅） */
  var aiLines=imgWrap(mc,"⚠ 本内容由 AI 生成整理，未经医学专业人员审核，不能作为医疗依据", CW-30, 17, "bold");
  var ah=12+aiLines.length*24+12;
  R(0,NH+132,W,ah,0,C.dangerL);
  LINES(aiLines,PAD,NH+132+12,17,"bold",C.danger,24,CW);
  y=NH+132+ah+22;

  /* 指标卡 */
  var cols=3, gap=12, cw=(CW-gap*(cols-1))/cols, ch=94, rows=Math.ceil(P.metrics.length/cols);
  for(i=0;i<P.metrics.length;i++){
    var mt=P.metrics[i], cx=PAD+(i%cols)*(cw+gap), cy=y+Math.floor(i/cols)*(ch+gap);
    R(cx,cy,cw,ch,12,metricBg(mt.c));
    T(mt.v, cx+16, cy+16, 30, "bold", metricFg(mt.c), 36, cw-32);
    T(mt.k, cx+16, cy+58, 16, "", C.muted, 22, cw-32);
  }
  y += rows*(ch+gap)+4;
  if(P.packYears) y += T("吸烟量折算约 "+(Math.round(P.packYears*10)/10)+" 包年", PAD, y, 17, "", C.muted, 24, CW)+8;
  y += 18;

  /* 高风险 */
  y = H("您命中的高风险人群", y);
  function riskCard(x,w,yy,name,why,strong,src){
    var nw=w-40, nl=imgWrap(mc,name,nw,22,"bold"), wl=imgWrap(mc,"依据："+why,nw,17);
    var sl=src?imgWrap(mc,"出处："+src,nw,13):null;
    var h=14+nl.length*30+4+wl.length*25+(sl?4+sl.length*18:0)+14;
    R(x,yy,w,h,12, strong?C.amberL:C.grayL);
    R(x+2,yy+10,5,h-20,2.5, strong?C.amber:C.muted);
    var ty=yy+14;
    ty += LINES(nl,x+20,ty,22,"bold", strong?C.danger:C.ink, 30);
    ty += 4;
    ty += LINES(wl,x+20,ty,17,"", strong?"#6b4a12":C.muted, 25);
    if(sl){ ty+=4; LINES(sl,x+20,ty,13,"",C.muted,18); }
    return h;
  }
  if(!P.risksHi.length && !P.risksWa.length && !P.warns.length){
    y += T("未发现明确的高风险条件。仍建议完成基础项目，并按年龄、性别做常规筛查。", PAD, y, 18, "", C.muted, 26, CW)+10;
  }
  if(P.risksHi.length){
    y += T("明确高风险", PAD, y, 18, "bold", C.amber, 26, CW)+6;
    for(i=0;i<P.risksHi.length;i++){ y += riskCard(PAD,CW,y,P.risksHi[i].name,P.risksHi[i].why,true,P.risksHi[i].src)+8; }
  }
  if(P.risksWa.length){
    y += T("需关注（条件较宽泛，建议与医生讨论）", PAD, y, 18, "bold", C.muted, 26, CW)+6;
    for(i=0;i<P.risksWa.length;i++){ y += riskCard(PAD,CW,y,P.risksWa[i].name,P.risksWa[i].why,false,P.risksWa[i].src)+8; }
  }
  for(i=0;i<P.warns.length;i++){ y += riskCard(PAD,CW,y,"提示",P.warns[i],false,"")+8; }
  y += 18;

  /* 三档项目 */
  y = H("建议的体检项目", y);
  for(var t=0;t<P.tiers.length;t++){
    var tr=P.tiers[t];
    var dotC = tr.cls==="b"?C.muted:tr.cls==="p"?C.brand:C.amber;
    R(PAD,y+9,12,12,6,dotC);
    y += T(tr.title, PAD+20, y, 23, "bold", C.ink, 32, CW-20)+10;
    for(j=0;j<tr.groups.length;j++){
      var g=tr.groups[j], pad=14, iw=CW-pad*2-12;
      var nl2=imgWrap(mc,g.g,CW-pad*2,20,"bold");
      var sl2=g.src?imgWrap(mc,"依据："+g.src, CW-pad*2, 13):null;
      var il=g.list.map(function(it){ return imgWrap(mc,"· "+it, iw, 17); });
      var nl3=g.note?imgWrap(mc,"注："+g.note, iw, 15):null;
      var gh=pad+nl2.length*28+(sl2?4+sl2.length*18:0)+6;
      for(var q=0;q<il.length;q++) gh += il[q].length*24+4;
      if(nl3) gh += nl3.length*21+6;
      gh += pad;
      R(PAD,y,CW,gh,12,C.white,C.line,1.5);
      var ty2=y+pad;
      ty2 += LINES(nl2,PAD+pad,ty2,20,"bold",C.brandD,28);
      if(sl2){ ty2 += 4; ty2 += LINES(sl2,PAD+pad,ty2,13,"",C.muted,18); }
      ty2 += 6;
      for(var q2=0;q2<il.length;q2++) ty2 += LINES(il[q2],PAD+pad+6,ty2,17,"",C.ink,24)+4;
      if(nl3){ ty2+=6; LINES(nl3,PAD+pad+6,ty2,15,"",C.muted,21); }
      y += gh+10;
    }
    y += 10;
  }

  /* 挂号与科室指引 */
  var depts2=buildDepts(P);
  y = H("下一步：挂号与科室指引", y);
  for(i=0;i<depts2.length;i++){
    var dn=(i+1)+". "+depts2[i].d;
    var dw=depts2[i].why.length?depts2[i].why.join("、"):"开具体检单、完成全部基础项目";
    var nl4=imgWrap(mc,dn,CW-16,18,"bold");
    var wl4=imgWrap(mc,dw,CW-16,14);
    var bh=10+nl4.length*24+3+wl4.length*19+10;
    R(PAD,y,CW,bh,10,C.grayL);
    var by=y+10;
    by += LINES(nl4,PAD+12,by,18,"bold",C.brandD,24);
    by += 3;
    LINES(wl4,PAD+12,by,14,"",C.muted,19);
    y += bh+7;
  }
  y += 6;
  for(i=0;i<DEPT_TIPS.length;i++) y += liDot(DEPT_TIPS[i], 13, C.muted, 20)+6;
  y += 16;

  /* 提醒 */
  if(P.notes.length){
    var nlines=P.notes.map(function(s){ return imgWrap(mc,s,CW-30,17); });
    var nh=16;
    for(i=0;i<nlines.length;i++){ nh += nlines[i].length*25; if(i<nlines.length-1) nh+=10; }
    nh += 16;
    R(PAD,y,CW,nh,12,C.dangerL);
    y += 16;
    for(i=0;i<nlines.length;i++){ y += LINES(nlines[i],PAD+16,y,17,"","#7a2a24",25); if(i<nlines.length-1) y+=10; }
    y += 16+18;
  }

  /* 老年 */
  if(P.elder.length){
    y = H("老年人专项发现", y);
    for(i=0;i<P.elder.length;i++){
      var et=P.elder[i].t, el=imgWrap(mc,et,CW-40,18);
      var eh=14+el.length*25+14;
      R(PAD,y,CW,eh,12, P.elder[i].lvl==="bad"?C.dangerL:C.amberL);
      R(PAD+2,y+10,5,eh-20,2.5, P.elder[i].lvl==="bad"?C.danger:C.amber);
      LINES(el,PAD+20,y+14,18,"", P.elder[i].lvl==="bad"?"#7a2a24":"#6b4a12",25);
      y += eh+8;
    }
    y += 6;
    y += T("依据 WS/T 888-2026 等国家标准，建议为老人补充的评估", PAD, y, 20, "bold", C.brandD, 28, CW)+10;
    for(j=0;j<P.elderItems.length;j++){
      var eg=P.elderItems[j];
      var nlE=imgWrap(mc,eg.g, CW-28, 17, "bold");
      var ilE=imgWrap(mc,eg.list.join("；"), CW-28, 14);
      var eh=10+nlE.length*23+4+ilE.length*20+10;
      R(PAD,y,CW,eh,10,C.white,C.line,1);
      R(PAD+3,y+11,4,eh-22,2,C.brand);
      var ey=y+10;
      ey += LINES(nlE,PAD+15,ey,17,"bold",C.ink,23);
      ey += 4;
      LINES(ilE,PAD+15,ey,14,"",C.muted,20);
      y += eh+7;
    }
    y += 18;
  }

  /* 依据文件 + 标注说明 + AI 声明 */
  y += 10;
  y += T("本工具依据以下文件设计：", PAD, y, 16, "bold", C.ink, 22, CW)+4;
  for(i=0;i<SOURCES.length;i++) y += liNum((i+1)+".", SOURCES[i], 13, C.muted, 20)+4;
  y += T("※ 上述文件的完整原文（含全文收录／未公开标注），见网页版首页「📖 查看依据文件完整原文」按钮。", PAD+6, y, 13, "", C.brandD, 19, CW-12)+3;
  y += 8;
  y += T(CITE_NOTE, PAD, y, 13, "", C.muted, 19, CW)+8;
  y += T("AI 生成声明：" + AI_NOTICE, PAD, y, 13, "", C.danger, 19, CW)+8;

  y += T("全部计算在本机完成，不采集、不上传任何个人信息 ｜ "+VERSION, PAD, y, 13, "", C.muted, 19, CW)+34;

  return {ops:ops, h:y};
}

function drawOps(ctx,ops){
  ctx.textBaseline="top";
  for(var i=0;i<ops.length;i++){
    var o=ops[i];
    if(o.t==="r"){
      var x=o.x,yy=o.y,w=o.w,h=o.h,r=o.r||0;
      ctx.beginPath();
      if(ctx.roundRect){ ctx.roundRect(x,yy,w,h,r); }
      else{
        r=Math.min(r,w/2,h/2);
        ctx.moveTo(x+r,yy); ctx.arcTo(x+w,yy,x+w,yy+h,r); ctx.arcTo(x+w,yy+h,x,yy+h,r);
        ctx.arcTo(x,yy+h,x,yy,r); ctx.arcTo(x,yy,x+w,yy,r); ctx.closePath();
      }
      if(o.f){ ctx.fillStyle=o.f; ctx.fill(); }
      if(o.s){ ctx.strokeStyle=o.s; ctx.lineWidth=o.sw||1.5; ctx.stroke(); }
    } else if(o.t==="t"){
      ctx.font=o.font; ctx.fillStyle=o.color;
      for(var j=0;j<o.lines.length;j++) ctx.fillText(o.lines[j], o.x, o.y+j*o.lh);
    }
  }
}

/* 精简版：同一套布局引擎，只压缩内容（不含推荐理由、合并明细、去掉老年明细） */
function buildBriefPlan(){
  var P=buildPlan();
  var B={metrics:P.metrics, packYears:P.packYears, family:P.family,
         risksHi:[], risksWa:[], warns:[], tiers:[], notes:P.notes.slice(), elder:[], elderItems:[]};
  if(P.risksHi.length) B.risksHi.push({k:"", name:"明确高风险（"+P.risksHi.length+" 项）", why:P.risksHi.map(function(x){return x.name;}).join("、"), src:""});
  if(P.risksWa.length) B.risksWa.push({k:"", name:"需关注（"+P.risksWa.length+" 项）", why:P.risksWa.map(function(x){return x.name;}).join("、"), src:""});

  /* 基础项目汇总：按大类归并成整段 */
  var base=null;
  for(var bi=0;bi<P.tiers.length;bi++) if(P.tiers[bi].cls==="b") base=P.tiers[bi];
  var cat={}, order=[];
  if(base) base.groups.forEach(function(g){
    var key=g.g.indexOf("·")>=0 ? g.g.split("·")[0].trim() : g.g;
    if(!cat[key]){ cat[key]=[]; order.push(key); }
    g.list.forEach(function(it){ cat[key].push(it); });
  });
  var bg=order.map(function(k){ return {g:k, src:"", list:[cat[k].join("；")], note:""}; });
  if(bg.length) B.tiers.push({cls:"b", title:"基础项目汇总（所有成年人都应完成）", groups:bg});

  /* 建议加查汇总：按风险病种归并，不带依据细节 */
  var pg=[];
  P.tiers.forEach(function(t){
    if(t.cls!=="p") return;
    t.groups.forEach(function(g){ pg.push({g:g.g, src:"", list:[g.list.join("；")], note:""}); });
  });
  if(pg.length) B.tiers.push({cls:"p", title:"建议加查项目汇总（根据您的风险）", groups:pg});
  if(P.elder.length) B.notes.push("另发现 "+P.elder.length+" 项老年人专项问题（衰弱、肌少症、跌倒、认知、听力、营养、用药等），详见完整版。");
  return B;
}

10~119<br>120~129<br>130~139<br>140~149<br>150~159<br>≥160<\/td><td>0<br>1<br>3<br>6<br>7<br>8<br>10<\/td><\/tr><tr><td>体重指数（kg/m2）<\/td><td><\/td><\/tr><tr><td>&lt;22.0<br>22.0~23.9<br>24.0~29.9<br>≥30.0<\/td><td>0<br>1<br>3<br>5<\/td><\/tr><tr><td>腰围（cm）<\/td><td><\/td><\/tr><tr><td>男&lt;75.0，女&lt;70.0<br>男75.0~79.9，女70.0~74.9<br>男80.0~84.9，女75.0~79.9<br>男85.0~89.9，女80.0~84.9<br>男90.0~94.9，女85.0~89.9<br>男≥95.0，女≥90.0<\/td><td>0<br>3<br>5<br>7<br>8<br>10<\/td><\/tr><tr><td>糖尿病家族史（父母、子女以及兄弟姐妹）<\/td><\/tr><tr><td>无<br>有<\/td><td>0<br>6<\/td><\/tr><tr><td>性别<\/td><td><\/td><\/tr><tr><td>女<br>男<\/td><td>0<br>2<\/td><\/tr><\/table><h4>三、慢性阻塞性肺疾病（COPD）风险人群<\/h4><p>以下各项累计评分≥16分者，为COPD高风险人群。<\/p><table><tr><th>问题<\/th><th>评分标准（分）<\/th><\/tr><tr><td>1.您的年龄<\/td><td>40-49岁<\/td><td>0<\/td><\/tr><tr><td>1.您的年龄<\/td><td>50-59岁<\/td><td>4<\/td><\/tr><tr><td>1.您的年龄<\/td><td>60-69岁<\/td><td>8<\/td><\/tr><tr><td>1.您的年龄<\/td><td>≥70岁<\/td><td>11<\/td><\/tr><tr><td>2. 您的吸烟总量？吸烟总量=每天吸烟（包）×吸烟（年）<\/td><td>从不吸烟<\/td><td>0<\/td><\/tr><tr><td>2. 您的吸烟总量？吸烟总量=每天吸烟（包）×吸烟（年）<\/td><td>1-14包年<\/td><td>2<\/td><\/tr><tr><td>2. 您的吸烟总量？吸烟总量=每天吸烟（包）×吸烟（年）<\/td><td>15-29包年<\/td><td>4<\/td><\/tr><tr><td>2. 您的吸烟总量？吸烟总量=每天吸烟（包）×吸烟（年）<\/td><td>≥30包年<\/td><td>5<\/td><\/tr><tr><td>3.您的体重指数？体重指数=体重（kg）/身高²（m²）<\/td><td>&lt;18.5 kg/m²<\/td><td>7<\/td><\/tr><tr><td>3.您的体重指数？体重指数=体重（kg）/身高²（m²）<\/td><td>18.5-23.9 kg/m²<\/td><td>4<\/td><\/tr><tr><td>3.您的体重指数？体重指数=体重（kg）/身高²（m²）<\/td><td>24.0-27.9 kg/m²<\/td><td>1<\/td><\/tr><tr><td>3.您的体重指数？体重指数=体重（kg）/身高²（m²）<\/td><td>≥28.0 kg/m²<\/td><td>0<\/td><\/tr><tr><td>4.没有感冒时您是否常有咳嗽？<\/td><td>是<\/td><td>5<\/td><\/tr><tr><td>4.没有感冒时您是否常有咳嗽？<\/td><td>否<\/td><td>0<\/td><\/tr><tr><td>5.您平时是否感觉有气促？<\/td><td>没有气促<\/td><td>0<\/td><\/tr><tr><td>5.您平时是否感觉有气促？<\/td><td>在平地急行或爬小坡时感觉气促<\/td><td>3<\/td><\/tr><tr><td>5.您平时是否感觉有气促？<\/td><td>平地正常行走时感觉气促<\/td><td>6<\/td><\/tr><tr><td>6.您主要使用过生物燃料烹饪吗？（生物燃料指利用生物体制取的燃料，比如玉米秆、玉米芯等）<\/td><td>是<\/td><td>1<\/td><\/tr><tr><td>6.您主要使用过生物燃料烹饪吗？（生物燃料指利用生物体制取的燃料，比如玉米秆、玉米芯等）<\/td><td>否<\/td><td>0<\/td><\/tr><tr><td>7.您的父母、子女以及兄弟姐妹是否有人患支气管哮喘、慢性支气管炎、肺气肿或慢阻肺？<\/td><td>是<\/td><td>3<\/td><\/tr><tr><td>7.您的父母、子女以及兄弟姐妹是否有人患支气管哮喘、慢性支气管炎、肺气肿或慢阻肺？<\/td><td>否<\/td><td>0<\/td><\/tr><\/table><h4>四、肺癌风险人群<\/h4><p>年龄≥50岁，且符合以下任意一项者为肺癌高风险人群。<\/p><p>（一）吸烟包年数≥20包年，包括曾经吸烟≥20包年，但戒烟不足15年。注：吸烟包年数=每天吸烟的包数（每包20支）×吸烟年数；<\/p><p>（二）与吸烟人群共同生活或同室工作≥20年；<\/p><h4>（三）患有慢性阻塞性肺疾病；<\/h4><p>（四）有职业暴露史（石棉、氡、铍、铬、镉、镍、硅、煤烟和煤烟尘等）至少1年；<\/p><p>（五）有一级亲属（父母、子女以及兄弟姐妹）确诊肺癌。<\/p><h4>五、结直肠癌风险人群<\/h4><h4>（一）散发性结直肠癌高风险人群<\/h4><p>以下各项累计评分≥4分者，为结直肠癌高风险人群。<\/p><p>1.年龄：≤49岁（0分），50-59岁（1分），≥60岁（2分）；<\/p><h4>2.性别：女性（0分），男性（1分）；<\/h4><h4>3.吸烟史：无（0分），有（1分）；<\/h4><p>4.体重指数：&lt;23kg/m2（0分），≥23kg/m2（1分）；<\/p><p>5.一级亲属（父母、子女以及兄弟姐妹）确诊结直肠癌：无（0分），有（1分；其中，如有1个一级亲属&lt;60岁时被确诊为结直肠癌，或者2个一级亲属确诊结直肠癌4分）。<\/p><h4>（二）遗传性结直肠癌高风险人群<\/h4><p>具有林奇综合征或患有家族性腺瘤性息肉病等的人群。<\/p><h4>六、胃癌风险人群<\/h4><p>年龄≥45岁，且符合以下任意一项者，为胃癌高风险人群；<\/p><p>（一）居住于胃癌高发地区（以县级行政区为单位界定，以2000年中国人口结构为标准的年龄标化发病率&gt;20/10万）；<\/p><p>（二）一级亲属（父母、子女以及兄弟姐妹）中有胃癌病史；<\/p><p>（三）尿素呼气试验、血清幽门螺杆菌抗体、粪便幽门螺杆菌抗原检测任一阳性；<\/p><p>（四）吸烟、重度饮酒、高盐饮食、腌制食品等不良生活方式和饮食习惯；<\/p><p>（五）患有慢性萎缩性胃炎、胃溃疡、胃息肉、手术后残胃、肥厚性胃炎、恶性贫血等疾病。<\/p><h4>七、肝癌风险人群<\/h4><p>肝癌高危人群主要包括：具有乙型肝炎病毒和/或丙型肝炎病毒感染、过度饮酒、肝脂肪变性或代谢功能障碍相关性肝病、饮食中黄曲霉毒素B1的暴露、其他各种原因引起的肝硬化及有肝癌家族史等人群，尤其年龄＞40岁的男性。<\/p><h4>八、乳腺癌风险人群<\/h4><p>符合以下任一条件者，为乳腺癌高风险人群。<\/p><h4>（一）有遗传家族史,即具备以下任意一项者<\/h4><p>1.一级亲属（父母、子女以及兄弟姐妹）有乳腺癌或卵巢癌史；<\/p><p>2.二级亲属50岁前,患乳腺癌2人及以上；<\/p><p>3.二级亲属50岁前,患卵巢癌2人及以上；<\/p><p>4.至少1位一级亲属携带已知BRCA1/2基因致病性遗传突变;或自身携带BRCA1/2基因致病性遗传突变。<\/p><h4>（二）具备以下任意一项者<\/h4><h4>1.月经初潮年龄≤12岁；<\/h4><h4>2.绝经年龄≥55岁；<\/h4><p>3.有乳腺活检史或乳腺良性疾病手术史,或病理证实的乳腺（小叶或导管）不典型增生病史；<\/p><p>4.使用“雌孕激素联合”的激素替代治疗不少于半年；<\/p><p>5.45岁后乳腺X线检查提示乳腺实质(或乳房密度)类型为不均匀致密型或致密型。<\/p><h4>（三）具备以下任意两项者<\/h4><h4>1.无哺乳史或哺乳时间&lt;4个月；<\/h4><p>2.无活产史(含从未生育、流产、死胎)或初次活产年龄&gt;30岁；<\/p><p>3.仅使用“雌激素”的激素替代治疗不少于半年；<\/p><p>4.流产(含自然流产和人工流产)≥2次。<\/p><h4>九、前列腺癌风险人群<\/h4><p>符合下列条件之一的男性，为前列腺癌高风险人群。<\/p><h4>（一）年龄≥60岁；<\/h4><h4>（二）年龄≥45岁且有前列腺癌家族史；<\/h4><p>（三）携带BRCA2基因突变且年龄≥40岁。<\/p><h4>十、卵巢癌风险人群<\/h4><p>符合下列条件之一的女性，为卵巢癌高风险人群。<\/p><h4>（一）有乳腺癌和卵巢癌家族史；<\/h4><p>（二）BRCA1和BRCA2胚系突变携带者；<\/p><p>（三）林奇综合征、利–弗劳梅尼综合征家族的女性。<\/p><h4>十一、食管癌风险人群<\/h4><p>年龄≥45岁，且符合以下任意一项者为食管癌高风险人群。<\/p><p>（一）居住于食管癌高发地区（以县级行政区为单位界定，以2000年中国人口结构为标准的年龄标化发病率&gt;15/10万）；<\/p><p>（二）父母、子女以及兄弟姐妹等一级亲属中有食管癌病史；<\/p><p>（三）热烫饮食、高盐饮食、腌制食品、吸烟、重度饮酒等不良饮食习惯和生活方式；<\/p><p>（四）患有慢性食管炎、巴雷特食管、食管憩室、贲门失弛缓症、反流性食管炎、食管良性狭窄等疾病；<\/p><p>（五）有食管的癌前病变诊疗史。<\/p><h4>十二、甲状腺癌风险人群<\/h4><p>符合下列条件之一的，为甲状腺癌高风险人群。<\/p><p>（一）童年期头颈部放射线照射史或放射性尘埃接触史；<\/p><h4>（二）全身放射治疗史；<\/h4><p>（三）分化型甲状腺癌、甲状腺髓样癌或多发性内分泌腺瘤病Ⅱ型、家族性多发性息肉病、某些甲状腺癌综合征（如多发性错构瘤综合征、卡尼综合征、维尔纳综合征和加德纳综合征等）的既往史或家族史。<\/p><h4>十三、认知功能障碍筛查风险人群<\/h4><p>（一）推荐≥50岁的人群开展脑认知健康筛查；<\/p><p>（二）在伴有痴呆危险因素、认知障碍家族史及主观认知下降的人群中，筛查年龄可提前至40岁或根据个体化情况及早筛查。<\/p><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wgARCAMnAqEDASIAAhEBAxEB/8QAGwABAQADAQEBAAAAAAAAAAAAAAUCAwQGAQf/xAAVAQEBAAAAAAAAAAAAAAAAAAAAAf/aAAwDAQACEAMQAAAB/SAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAETpKSaKSaKSaKSaKSaKSaKSaKSaKSaKSNZAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAJtKbSAAE6j5SLPZ5fgs9nj4Levttn5tcT2rk61AAm0ptIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAm0oXWUk0Uk0UuHWMaHCOrLhyO1xChlNFJNFJNClEtgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAE2lNpAAAAAAAAAAAAAAAAAAAAAAAAAABNFJNFJNFJNFJNFJNFJNFJNFJNFJNFJNFJNFJNFJNFJNFL5OHiv0eRtKSaKSaKSaKSaKSaKSaKSaKSaKSaKSaKSaKSaKSaKSaKSaKSfQAAAAAAAAAAJtKbSPE6fnJHr8PJ6bPV4UosuGE35XofsbjKfPO4j1/R5fhPWp+09J5nX5s/Y/smsnmuDugS+hivNV7mZ88jHv8ARw6D0mHPBs9RH0+cX23zknp+mfZdQBQAAAAAAAAAAAJtKbSAAAAAAAAAAJtKbSNGH5v+jG1z/Dt+yNUVvnFtOjOUOz7M32UNkz4tRD7I79WvSdHdA2lri4dtdevjyjq+69B3/ZWyqeqX1JQxdC83JUAAAAAAAAAAAAAAE2lNpAAAAAAAAAAE2lNpEqp4z1xu5t2mOHOZRs7OXXuXLHHQd+GU87vn3lh1fZ9d+37qPm/k1G771T47uLq6jRooK4OWyJG+gOXqAAAAAAAAAAAAAAACbSm0gAAAAAAAAACbSm0jxnrZ1Y5c+jCPP9275ZwdPVvWbqqaoxnddWyWqF4OC8OTHtELG+ObirCDZ2gAAAAAAAAAAAAAAAAAACbSm0gAAAAAAAAACbSm0j8
